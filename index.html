      ST.benchSelIdx=null; ST.otherSelId=null;
      if(ST.formationSelIdx===null){ ST.formationSelIdx=idx; }
      else if(ST.formationSelIdx===idx){ ST.formationSelIdx=null; }
      else { const a=ST.formationSelIdx; [ST.starters[a],ST.starters[idx]]=[ST.starters[idx],ST.starters[a]]; ST.formationSelIdx=null; }
      render();
    };
    pitch.appendChild(div);
  });
  wrap.appendChild(pitch);

  const statPanel=el(`<div class="card"></div>`);
  const selP = ST.formationSelIdx!==null ? ST.starters[ST.formationSelIdx] : null;
  if(selP){
    const avg=Math.round(total(selP)/5); const [rk,rc]=getRank(avg);
    statPanel.innerHTML=`<div class="section-title">選択中の選手の能力：${esc(selP.name)} <span class="pill ${rc}" style="margin-left:6px;">${rk} ${avg}</span></div>`;
    ["sho","pas","dri","def","phy"].forEach(k=>{
      const val=selP[k]; const [r,c]=getRank(val);
      statPanel.appendChild(el(`<div class="stat-bar-row">
        <div class="stat-bar-label">${k.toUpperCase()}</div>
        <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${val}%;"></div></div>
        <div class="stat-bar-val num">${val}</div>
        <span class="pill ${c}">${r}</span>
      </div>`));
    });
    assignPlayerTraits(selP);
    ensurePlayerSkills(selP);
    statPanel.appendChild(el(`<div style="margin-top:10px;"><div class="section-title" style="font-size:12px;margin-bottom:5px;">🧠 性格・成長タイプ</div><div class="small">${esc(getPlayerPersonality(selP).name)}　/　${esc(getGrowthType(selP).name)}</div></div>`));
    statPanel.appendChild(el(`<div style="margin-top:8px;"><div class="section-title" style="font-size:12px;margin-bottom:5px;">✨ 所持スキル</div><div style="display:flex;flex-wrap:wrap;gap:4px;">${playerSkillsInlineHtml(selP)}</div></div>`));
    statPanel.appendChild(el(`<div class="small" style="margin-top:8px;">別の選手（スタメン枠・ベンチ・その他登録選手）をタップすると入れ替わります。</div>`));
  } else {
    statPanel.innerHTML=`<div class="section-title">能力を確認</div><div class="small">選手をタップすると能力が表示されます。もう一度タップで入れ替え相手を選べます。</div>`;
  }
  wrap.appendChild(statPanel);

  const bcard=el(`<div class="card"></div>`);
  bcard.innerHTML=`<div class="section-title">ベンチメンバー (${ST.bench.length}/9)</div><div class="small" style="margin-bottom:8px;">スタメン選手を1人選んでからベンチ選手をタップすると交代します。ベンチ選手をタップして選択すると、その他の登録選手と入れ替えられます。</div>`;
  for(let i=0;i<9;i++){
    const p=ST.bench[i];
    const item=el(`<div class="bench-item ${ST.benchSelIdx===i?'selected':''}"></div>`);
    if(p){
      const avg=Math.round(total(p)/5); const [rk,rc]=getRank(avg);
      item.innerHTML=`<div style="min-width:0;"><span>${esc(p.pos)} ${esc(p.name)} <span class="pill ${rc}">${rk}${avg}</span></span><div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;">${playerSkillsInlineHtml(p)}</div></div>
        <span><span class="cond-dot" style="background:${CONDITION_COLORS[p.condition]};"></span>${CONDITION_LABELS[p.condition]}</span>`;
    } else {
      item.innerHTML=`<span class="small">Sub ${i+1}: (未指定)</span>`;
    }
    item.onclick=()=>{
      if(ST.formationSelIdx!==null){
        if(p){
          const starter=ST.starters[ST.formationSelIdx];
          ST.starters[ST.formationSelIdx]=p;
          ST.bench[i]=starter;
          ST.formationSelIdx=null;
          render();
        }
        return;
      }
      if(ST.otherSelId!=null){
        const roster=ST.teams[ST.myTeam].roster;
        const otherP=roster.find(x=>x.id===ST.otherSelId);
        if(otherP) benchSwapIn(i, otherP);
        render();
        return;
      }
      ST.benchSelIdx = (ST.benchSelIdx===i) ? null : i;
      render();
    };
    bcard.appendChild(item);
  }
  wrap.appendChild(bcard);

  const benchIds=new Set(ST.bench.filter(Boolean).map(p=>p.id));
  const starterIds=new Set(Object.values(ST.starters).filter(Boolean).map(p=>p.id));
  const others=ST.teams[ST.myTeam].roster.filter(p=>!starterIds.has(p.id) && !benchIds.has(p.id));
  if(others.length){
    const ocard=el(`<div class="card"></div>`);
    ocard.innerHTML=`<div class="section-title">その他の登録選手 (${others.length}名)</div><div class="small" style="margin-bottom:8px;">スタメン選手を1人選んでからここの選手をタップすると入れ替わります。ベンチ選手（またはこの選手）を選んでからタップすると、ベンチと入れ替えられます。</div>`;
    others.forEach(p=>{
      const item=el(`<div class="bench-item ${ST.otherSelId===p.id?'selected':''}"></div>`);
      const avg=Math.round(total(p)/5); const [rk,rc]=getRank(avg);
      item.innerHTML=`<div style="min-width:0;"><span>${esc(p.pos)} ${esc(p.name)} <span class="pill ${rc}">${rk}${avg}</span></span><div style="margin-top:3px;display:flex;flex-wrap:wrap;gap:3px;">${playerSkillsInlineHtml(p)}</div></div>
        <span><span class="cond-dot" style="background:${CONDITION_COLORS[p.condition]};"></span>${CONDITION_LABELS[p.condition]}</span>`;
      item.onclick=()=>{
        if(ST.formationSelIdx!==null){
          ST.starters[ST.formationSelIdx]=p;
          ST.formationSelIdx=null;
          render();
          return;
        }
        if(ST.benchSelIdx!==null){
          benchSwapIn(ST.benchSelIdx, p);
          render();
          return;
        }
        ST.otherSelId = (ST.otherSelId===p.id) ? null : p.id;
        render();
      };
      ocard.appendChild(item);
    });
    wrap.appendChild(ocard);
  }
  return wrap;
}

const SQUAD_SORT_OPTIONS=[
  {key:"total", label:"総合力", defaultDir:"desc"},
  {key:"pos",   label:"ポジション", defaultDir:"asc"},
  {key:"age",   label:"年齢", defaultDir:"asc"},
  {key:"name",  label:"名前", defaultDir:"asc"},
  {key:"contract", label:"契約残", defaultDir:"asc"},
  {key:"condition", label:"調子", defaultDir:"desc"},
];
const SQUAD_SORT_POS_ORDER={GK:0,DF:1,MF:2,FW:3};
function squadSortValue(p, key){
  switch(key){
    case "total": return total(p);
    case "pos": return SQUAD_SORT_POS_ORDER[p.pos] ?? 9;
    case "age": return p.age;
    case "name": return p.name;
    case "contract": return p.contractYearsLeft==null ? 999 : p.contractYearsLeft;
    case "condition": return p.condition ?? 0;
    default: return 0;
  }
}
function annualSalaryTotal(teamName=ST.myTeam){
  const team=ST.teams[teamName];
  if(!team || !Array.isArray(team.roster)) return 0;
  return team.roster.reduce((sum,p)=>sum+(Number(p.salary)||0),0);
}

function salarySaleValue(p){
  return Math.max(1, Math.round(marketValue(p)*0.7));
}

function settleAnnualSalary(){
  if(!ST.salarySettlement) return true;
  const required=Math.max(0, Number(ST.salarySettlement.required)||0);
  if(ST.budget<required) return false;
  if(!spendBudget(required,"持ち金が足りません。選手を売却して資金を確保してください。")) return false;
  ST.salarySettlement=null;
  addNews(`💴 年間年俸を支払いました（$${required}M）。`);
  return true;
}

function renderSalarySettlementModal(){
  const ss=ST.salarySettlement;
  if(!ss) return null;
  const required=Math.max(0,Number(ss.required)||0);
  const shortfall=Math.max(0,required-ST.budget);
  const roster=ST.teams[ST.myTeam].roster;
  const ov=el(`<div class="modal-overlay"></div>`);
  const m=el(`<div class="modal center" style="max-height:88vh;overflow:auto;"><div class="modal-title">💴 シーズン終了・年俸支払い</div></div>`);
  m.appendChild(el(`<div class="small" style="margin-bottom:10px;">今年支払う合計年俸が予算を上回っています。選手を売却して不足分を補填してください。</div>`));
  m.appendChild(el(`<div class="stat-row"><span>必要な年俸</span><span class="num">$${required}M</span></div>`));
  m.appendChild(el(`<div class="stat-row"><span>現在の予算</span><span class="num">$${ST.budget}M</span></div>`));
  m.appendChild(el(`<div class="stat-row"><span>不足額</span><span class="num" style="color:var(--red);font-weight:700;">$${shortfall}M</span></div>`));
  m.appendChild(el(`<div class="section-title" style="margin-top:12px;">売却する選手を選択</div>`));
  roster.forEach((p,idx)=>{
    const value=salarySaleValue(p);
    const item=el(`<div class="list-item"><div><div class="pname">${esc(p.name)} <span class="small">(${p.pos} / ${p.age}歳)</span></div><div class="pmeta">年俸 $${p.salary||0}M/年 ・ 売却見込 $${value}M</div></div><button class="btn btn-sm btn-red">売却</button></div>`);
    const btn=item.querySelector('button');
    btn.onclick=()=>{
      const current=ST.teams[ST.myTeam].roster.find(x=>x.id===p.id);
      if(!current) return;
      // GKが1人しかいない場合は、そのGKを売却できない
      if(current.pos==='GK' && ST.teams[ST.myTeam].roster.filter(x=>x.pos==='GK').length<=1){
        ST.toast='GKが1人しかいないため、このGKは売却できません。'; render(); return;
      }
      const sale=salarySaleValue(current);
      removePlayerFromMyTeam(current);
      ST.budget+=sale;
      addNews(`💰 ${current.name} を$${sale}Mで売却しました。`);
      if(settleAnnualSalary()){
        const priorBalance=Math.round((Number(ST.budget)||0)-getSeasonStartBudget());
        ST.annualBalanceHistory=Array.isArray(ST.annualBalanceHistory)?ST.annualBalanceHistory:[];
        ST.annualBalanceHistory.unshift({season:ST.season-1,balance:priorBalance});
        if(ST.annualBalanceHistory.length>5) ST.annualBalanceHistory.length=5;
        ST.seasonStartBudget=ST.budget;
        ST.toast=`年俸支払い完了。${current.name}を$${sale}Mで売却しました。`;
      } else { ST.toast=`${current.name}を$${sale}Mで売却しました。さらに売却が必要です。`; }
      render();
    };
    m.appendChild(item);
  });
  ov.appendChild(m);
  return ov;
}

function getMyLoanedOutPlayers(){
  const list=[];
  Object.keys(ST.teams||{}).forEach(tName=>{
    if(tName===ST.myTeam) return;
    (ST.teams[tName].roster||[]).forEach(p=>{
      if(p.loanOriginalTeam===ST.myTeam) list.push({player:p,dest:tName,overseas:false,months:p.loanMonthsLeft||0});
    });
  });
  (ST.loansOutOverseas||[]).forEach(lo=>{
    if(lo.origin===ST.myTeam && lo.player) list.push({player:lo.player,dest:lo.destName,overseas:true,months:lo.monthsLeft||0});
  });
  return list;
}
function renderLoanOutList(){

function renderSquad(){
  const wrap=el(`<div></div>`);
  const roster=ST.teams[ST.myTeam].roster;
  const fCount = foreignCount(ST.myTeam);
  const header=el(`<div class="section-title">${esc(ST.myTeam)} 所属選手 (${roster.length}/30)</div>`);
  wrap.appendChild(header);
  wrap.appendChild(el(`<div class="small" style="margin-bottom:4px;">外国籍選手 ${fCount}/5</div>`));
  wrap.appendChild(el(`<div class="small" style="margin-bottom:8px;color:var(--gold);font-weight:700;">💴 今年支払う合計年俸 $${annualSalaryTotal()}M/年</div>`));
  const loaned=getMyLoanedOutPlayers();
  const loanBtn=el(`<button class="btn btn-gold btn-block" style="margin-bottom:10px;">📤 期限付き移籍中の選手を見る (${loaned.length}人)</button>`);
  loanBtn.onclick=()=>{ST.screen="loanOutList";render();};
  wrap.appendChild(loanBtn);
  if(!roster.length){ wrap.appendChild(el(`<div class="empty-state">選手がいません</div>`)); return wrap; }

  if(!ST.squadSort) ST.squadSort={key:"total", dir:"desc"};
  const sortBar=el(`<div class="sort-bar"></div>`);
  SQUAD_SORT_OPTIONS.forEach(opt=>{
    const isActive = ST.squadSort.key===opt.key;
    const arrow = isActive ? (ST.squadSort.dir==="asc" ? " ▲" : " ▼") : "";
    const chip=el(`<div class="sort-chip ${isActive?'active':''}">${opt.label}${arrow}</div>`);
    chip.onclick=()=>{
      if(ST.squadSort.key===opt.key){
        ST.squadSort.dir = ST.squadSort.dir==="asc" ? "desc" : "asc";
      } else {
        ST.squadSort={key:opt.key, dir:opt.defaultDir};
      }
      render();
    };
    sortBar.appendChild(chip);
  });
  wrap.appendChild(sortBar);

  const sortKey=ST.squadSort.key, sortDir=ST.squadSort.dir;
  const indexed=roster.map((p,idx)=>({p,idx}));
  indexed.sort((a,b)=>{
    const va=squadSortValue(a.p, sortKey), vb=squadSortValue(b.p, sortKey);
    let cmp;
    if(typeof va==="string") cmp=va.localeCompare(vb,"ja");
    else cmp=va-vb;
    return sortDir==="asc" ? cmp : -cmp;
  });

  indexed.forEach(({p,idx})=>{
    const [rk,rc]=getRank(Math.round(total(p)/5));
    let tag="";
    if(Object.values(ST.starters).some(s=>s&&s.id===p.id)) tag=`<span class="tag">スタメン</span>`;
    else if(ST.bench.some(s=>s.id===p.id)) tag=`<span class="tag">ベンチ</span>`;
    if(p.foreign) tag+=`<span class="tag" style="color:var(--blue);border-color:var(--blue);">海外</span>`;
    if(p.elite) tag+=`<span class="tag" style="color:var(--gold);border-color:var(--gold);">⭐</span>`;
    ensurePlayerSkills(p);
    if(p.skills.length) tag+=`<span class="tag" style="color:var(--blue);border-color:var(--blue);">${p.skills.length}スキル</span>`;
    if(p.fameMult && p.fameMult>1) tag+=`<span class="tag" style="color:var(--gold);border-color:var(--gold);">🏆表彰歴</span>`;
    if(negotiationLocked(p)) tag+=`<span class="tag" style="color:var(--red);border-color:var(--red);">${negotiationDeadlineLabel(p)}</span>`;
    if(p.contractYearsLeft!=null && !p.loanOriginalTeam){
      const expiring = p.contractYearsLeft<=1;
      tag+=`<span class="tag" style="${expiring?'color:var(--red);border-color:var(--red);':''}">契約残${p.contractYearsLeft}年</span>`;
    }
    const item=el(`<div class="list-item">
      <div style="min-width:0;flex:1;">
        <div class="pname">${esc(p.name)} <span class="small">(${p.age}歳)</span> ${tag}</div>
        <div class="pmeta"><span class="cond-dot" style="background:${CONDITION_COLORS[p.condition]};"></span>${CONDITION_LABELS[p.condition]} ・ ${p.pos}</div>
        ${quickStatsHtml(p)}
        <div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;">${playerSkillsInlineHtml(p)}</div>
      </div>
      <div class="player-pick-right" style="align-items:flex-end;"><span class="pill ${rc}">${rk} ${Math.round(total(p)/5)}</span>${playerSelectionDetailHtml(p)}<button class="btn btn-ghost" style="font-size:10px;padding:5px 7px;white-space:nowrap;" data-offer-toggle="1">${p.offerBlocked?'🚫 オファー拒否中':'📨 オファー受付中'}</button></div>
    </div>`);
    const offerBtn=item.querySelector('[data-offer-toggle="1"]');
    offerBtn.onclick=(e)=>{ e.stopPropagation(); p.offerBlocked=!p.offerBlocked; ST.toast=p.offerBlocked?`${p.name}への他クラブからのオファーを拒否しました。`:`${p.name}への他クラブからのオファー受付を再開しました。`; render(); };
    item.onclick=()=>{ ST.selPlayerIdx=idx; ST.playerDetailTeam=ST.myTeam; ST.screen="playerDetail"; render(); };
    wrap.appendChild(item);
  });
  return wrap;
}

function executeLoanOut(p, dest, fee){
  removePlayerFromMyTeam(p);

    ST.loansOutOverseas.push({player:p, destName:dest.name, monthsLeft:6, origin:ST.myTeam});
  } else {
    ST.teams[dest.name].roster.push(p);
    markImportant(dest.name);
  }
  addNews(`🔁 ${p.name} が${dest.name}へ期限付き移籍（レンタル）しました（$${fee}M）。`);
  ST.toast=`${p.name} を${dest.name}へレンタル移籍させました。`;

  ST.selPlayerIdx=Math.max(0, Math.min(ST.selPlayerIdx, ST.teams[ST.myTeam].roster.length-1));

}

function executeMarketBuyout(idx){
  if(!isTransferWindowOpen()){ ST.toast="現在は移籍加入期間外です。7〜9月、1〜2月に加入できます。"; render(); return; }
  const entry=ST.market[idx];
  if(!entry) return;
  const price=entry.price;
  if(ST.teams[ST.myTeam].roster.length>=30){ ST.toast="選手枠が上限です（30名）"; render(); return; }
  if(entry.foreign && foreignCount(ST.myTeam)>=5){ ST.toast="外国籍選手はすでに5人保有しています。"; render(); return; }
  if(ST.budget<price){ ST.toast="予算が不足しています。"; render(); return; }

  // 違約金を支払った後も、選手本人との年俸・契約年数交渉を必ず行う。
  ST.market.splice(idx,1);
  let bought=null, sourceTeam=entry.sourceTeam||null, removedFromSourceRoster=false;
  if(sourceTeam && ST.teams[sourceTeam]){
    const srcRoster=ST.teams[sourceTeam].roster;
    const found=srcRoster.find(x=>x.id===entry.id);
    if(!found){ ST.market.splice(Math.min(idx,ST.market.length),0,entry); ST.toast="対象選手はすでに移籍していました。"; render(); return; }
    srcRoster.splice(srcRoster.indexOf(found),1);
    bought=found;
    bought.fromTeam=sourceTeam;
    removedFromSourceRoster=true;
    markImportant(sourceTeam);
  } else {
    bought={...entry};
    delete bought.sourceTeam;
  }

  if(!spendBudget(price,"持ち金が足りません。")) {
    // 支払い直前に資金不足になった場合は市場から戻す。
    ST.market.splice(Math.min(idx,ST.market.length),0,entry);
    if(removedFromSourceRoster && sourceTeam && ST.teams[sourceTeam]) {
      const rr=ST.teams[sourceTeam].roster;
      const pos=rr.findIndex(x=>x.id===bought.id);
      if(pos<0) rr.push(bought);
    }
    render(); return;
  }
  delete bought.price;
  const years=Math.min(3,Math.max(1,bought.contractYears||1));
  ST.salaryNegotiation={
    player:bought,source:'market',sourceTeam,transferFee:price,
    years,salary:Math.max(1,calcSalary(bought,years)),message:`違約金 $${price}M を支払いました。次に年俸・契約年数を交渉します。`,
    locked:false,loan:false,removedFromMarket:true,removedFromFreeAgent:false,
    removedFromSourceRoster, buyoutPaid:true
  };
  render();
}

/* ---- 年俸交渉のクールダウン（決裂後2ヶ月） ---- */
function gameMonthIndex(){ return Math.max(1,((ST.season||1)-1)*12+(ST.month||1)); }
function negotiationUnlockAt(p){ return Number(p?.negotiationUnlockAt||ST.negotiationLocks?.[p?.id]||0); }
function negotiationLocked(p){ return negotiationUnlockAt(p)>gameMonthIndex(); }
function negotiationRemainingMonths(p){ return Math.max(0,negotiationUnlockAt(p)-gameMonthIndex()); }
function setNegotiationCooldown(p){
  if(!p||!p.id) return;
  const unlock=gameMonthIndex()+2;
  p.negotiationUnlockAt=unlock;
  ST.negotiationLocks=ST.negotiationLocks||{};
  ST.negotiationLocks[p.id]=unlock;
}
function negotiationDeadlineLabel(p){
  const rem=negotiationRemainingMonths(p);
  return rem>0 ? `🚫 交渉不可（あと${rem}ヶ月）` : '';
}

/* ---- 年俸・契約年数の交渉 ---- */
function salaryNegotiationChance(p, years, salary, isRenewal=false){
  const expected=Math.max(1,calcSalary(p,years));
  const ratio=salary/expected;
  let chance=0.25 + Math.min(0.7, Math.max(0, ratio-0.5)*0.9);
  // 現年俸を大きく下回る条件は更新交渉で不利
  if(isRenewal && salary < (p.salary||0)*0.9) chance-=0.18;
  if(years>=4) chance-=0.05;
  if(p.personalityId==='high_pro' || p.personality==='プロ意識が高い') chance+=0.04;
  if(p.personalityId==='low_pro' || p.personality==='プロ意識が低い') chance-=0.04;
  return Math.max(0.05,Math.min(0.95,chance));
}
function salaryExpectedLabel(p,years){ return Math.max(1,calcSalary(p,years)); }
function salaryChanceColor(c){ return c>=0.66?'var(--pitch)':c>=0.35?'var(--gold)':'var(--red)'; }

  if(!cm.locked){

    inputWrap.appendChild(input); inputWrap.appendChild(el(`<span style="font-weight:700;color:var(--text-dim);">M/年</span>`));
    m.appendChild(inputWrap);
    const meterWrap=el(`<div style="margin:6px 0 10px;"></div>`);

    m.appendChild(meterWrap);

      const salary=Math.max(1,parseInt(input.value,10)||1); cm.salary=salary;

      f.style.width=pct+'%'; f.style.background=c; q.textContent=pct+'%'; q.style.color=c;

    input.oninput=update;
    update();

    submit.onclick=()=>doContractExtend(p);

  if(cm.message) m.appendChild(el(`<div class="small" style="margin-top:10px;color:var(--gold);">${esc(cm.message)}</div>`));
  ov.appendChild(m); return ov;

function doContractExtend(p){
  const cm=ST.contractModal;
  const years=Math.max(1,Math.min(5,Number(cm.years)||1));
  const salary=Math.max(1,Math.round(Number(cm.salary)||salaryExpectedLabel(p,years)));
  const chance=salaryNegotiationChance(p,years,salary,true);
  if(Math.random()<chance){
    // 延長年数は現在の残り契約期間に加算する。
    const currentLeft=Math.max(0,Number(p.contractYearsLeft)||0);
    const currentTotal=Math.max(currentLeft,Number(p.contractYears)||0);
    p.contractYearsLeft=currentLeft+years;
    p.contractYears=currentTotal+years;
    p.salary=salary;
    cm.message=`契約延長に成功しました！ 残り${p.contractYearsLeft}年・年俸 $${salary}M（${years}年延長／成立確率${Math.round(chance*100)}%）`;
    addNews(`📝 ${p.name} と契約を延長しました（${years}年延長・残り${p.contractYearsLeft}年・年俸$${salary}M）。`);
  } else {
    setNegotiationCooldown(p);
    cm.message=`交渉決裂。提示年俸 $${salary}M・${years}年では合意できませんでした。今後2ヶ月はこの選手と再交渉できません。`;
  }
  cm.locked=true; render();
}

    function update(){ const sal=Math.max(1,parseInt(inp.value,10)||1); n.salary=sal; const ch=salaryNegotiationChance(p,years,sal,false),pct=Math.round(ch*100),c=salaryChanceColor(ch); mw.querySelector('#newSalaryChanceFill').style.width=pct+'%'; mw.querySelector('#newSalaryChanceFill').style.background=c; mw.querySelector('#newSalaryChancePct').textContent=pct+'%'; mw.querySelector('#newSalaryChancePct').style.color=c; }
    inp.oninput=update; update();
    const submit=el(`<button class="btn btn-primary btn-block">この条件で契約する</button>`); submit.onclick=()=>completeNewPlayerContract(); m.appendChild(submit);
  } else { const close=el(`<button class="btn btn-ghost btn-block">閉じる</button>`); close.onclick=()=>{ ST.salaryNegotiation=null; render(); }; m.appendChild(close); }
  if(n.message) m.appendChild(el(`<div class="small" style="margin-top:10px;color:var(--gold);">${esc(n.message)}</div>`));
  ov.appendChild(m); return ov;
}
function restoreHeldTransferPlayer(n, reAddToMarket=true){
  const p=n.player;
  if(!p) return;
  // 違約金を先払いしたケースは、年俸交渉決裂時に全額返金する。
  if(n.buyoutPaid){
    ST.budget += Number(n.transferFee||0);
    n.buyoutPaid=false;
  }
  if(n.source==='rookie' && n.removedFromRookieMarket){
    ST.rookies=Array.isArray(ST.rookies)?ST.rookies:[];
    if(!ST.rookies.some(x=>x.id===p.id)) ST.rookies.push(p);
  }
  // 違約金獲得時に相手クラブから一時的に抜いた選手を元クラブへ戻す。
  if(n.sourceTeam && n.removedFromSourceRoster && ST.teams[n.sourceTeam]){
    const sr=ST.teams[n.sourceTeam].roster;
    if(!sr.some(x=>x.id===p.id)) sr.push(p);
  }
  if(reAddToMarket && n.source==='market' && n.removedFromMarket){
    if(!ST.market.some(x=>x.id===p.id)) ST.market.push({...p, sourceTeam:n.sourceTeam||undefined});
  }
  if(reAddToMarket && n.source==='freeAgent' && n.removedFromFreeAgent){
    ST.freeAgents=Array.isArray(ST.freeAgents)?ST.freeAgents:[];
    if(!ST.freeAgents.some(x=>x.id===p.id)) ST.freeAgents.push(p);
  }
}
function completeNewPlayerContract(){
  const n=ST.salaryNegotiation,p=n.player;
  const years=Math.max(1,Math.min(5,Number(n.years)||1)); const salary=Math.max(1,Math.round(Number(n.salary)||salaryExpectedLabel(p,years)));
  const chance=salaryNegotiationChance(p,years,salary,false);
  if(Math.random()<chance){
    if(ST.teams[ST.myTeam].roster.length>=30){ n.message='選手枠が上限です。'; n.locked=true; render(); return; }
    if(p.foreign && foreignCount(ST.myTeam)>=5){ n.message='外国籍選手枠が上限です。'; n.locked=true; render(); return; }
    const sourceTeam=n.sourceTeam;
    if(sourceTeam && ST.teams[sourceTeam] && n.source!=='youth'){
      if(!n.removedFromSourceRoster){
        const sr=ST.teams[sourceTeam].roster, i=sr.findIndex(x=>x.id===p.id); if(i>=0) sr.splice(i,1);
      }
      markImportant(sourceTeam);
    }
    p.contractYears=years; p.contractYearsLeft=years; p.salary=salary; p.freeAgent=false; p.fromTeam=sourceTeam||p.fromTeam;
    if(n.loan){ p.loanOriginalTeam=sourceTeam; p.loanMonthsLeft=LOAN_DURATION_MONTHS; }
    if(n.source==='rookie'){
      p.scheduledJoinMonth=4;
      p.scheduledJoinSeason=ST.season;
      if(actualMonth()===4){
        p.rookieStatus='joined'; p.joinedMonth=4; p.joinedSeason=ST.season;
        ST.teams[ST.myTeam].roster.push(p);
        markImportant(ST.myTeam);
        ST.toast=`${p.name} が加入しました。`;
      }else{
        p.rookieStatus='pending';
        ST.pendingRookies=ST.pendingRookies||{};
        ST.pendingRookies[ST.myTeam]=ST.pendingRookies[ST.myTeam]||[];
        if(!ST.pendingRookies[ST.myTeam].some(x=>x.id===p.id)) ST.pendingRookies[ST.myTeam].push(p);
        markImportant(ST.myTeam);
        ST.toast=`${p.name} の契約が成立しました。翌シーズン4月に加入予定です。`;
      }
    } else {
      ST.teams[ST.myTeam].roster.push(p);
      if(n.source==='youth') ST.youthSignedThisSeason=(Number(ST.youthSignedThisSeason)||0)+1;
    }
    if(!n.buyoutPaid){
      const transferFee=Number(n.transferFee)||0;
      if(transferFee>0 && !spendBudget(transferFee,"持ち金が足りません。")){
        // 最終確定時にも資金を再確認し、マイナス残高を防ぐ。
        ST.teams[ST.myTeam].roster=ST.teams[ST.myTeam].roster.filter(x=>x.id!==p.id);
        restoreHeldTransferPlayer(n);
        n.message="持ち金が足りないため、契約できませんでした。"; n.locked=true; render(); return;
      }
    }
    n.buyoutPaid=false;
    markImportant(ST.myTeam);
    n.message=`契約成立！ ${years}年・年俸 $${salary}M（成立確率${Math.round(chance*100)}%）`;
    addNews(`📝 ${p.name} と契約しました（${years}年・年俸$${salary}M）。`);
    if(window.__J1_AUTO_SAVE) window.__J1_AUTO_SAVE();
    n.locked=true;
  } else {
    // 年俸交渉が決裂した選手は市場へ即時に戻さず、2ヶ月間は再交渉不可にする。
    restoreHeldTransferPlayer(n, false);
    setNegotiationCooldown(p);
    n.message=`年俸交渉が決裂しました。${p.name}は加入せず、今回の移籍金・契約金などの支出はすべて取り消されました。今後2ヶ月は同選手と交渉できません。`;
    n.locked=true;
  }
  render();
}

function renderNegoModal(){
  const n=ST.nego;
  const ov=el(`<div class="modal-overlay"></div>`);

  const t=n.snapshot;
  m.appendChild(el(`<div class="stat-row"><span>対象</span><span>${t.pos} ${esc(t.name)} (${t.age}歳)</span></div>`));

  const ctx=buildNegoContext(n,t);
  if(ctx.contractYearsLeft!=null || ctx.roleRank!=null || ctx.divGap!=null){
    const factorCard=el(`<div class="card" style="padding:10px 12px;margin-bottom:10px;background:var(--navy-2);"></div>`);

    }
    if(ctx.roleRank!=null){
      const roleLabel = ctx.roleRank>=0.85?'絶対的エース':ctx.roleRank>=0.6?'主力選手':ctx.roleRank>=0.35?'レギュラー争い':'控え選手';
      factorCard.appendChild(el(`<div class="stat-row" style="padding:2px 0;"><span class="small">クラブ内での役割</span><span class="small num">${roleLabel}</span></div>`));
    }
    if(ctx.divGap!=null){
      const gapLabel = ctx.divGap>0?`格下クラブ（${ctx.sourceTeam?ST.teams[ctx.sourceTeam].division:''}・引き抜きやすい）`:ctx.divGap<0?`格上クラブ（${ctx.sourceTeam?ST.teams[ctx.sourceTeam].division:''}・引き抜き困難）`:'同格クラブ';
      factorCard.appendChild(el(`<div class="stat-row" style="padding:2px 0;"><span class="small">クラブ間の格差</span><span class="small num">${gapLabel}</span></div>`));
    }
    m.appendChild(factorCard);
  }

  const targetLoanMonthsLeft = t.contractYearsLeft!=null ? Math.max(0, t.contractYearsLeft*12-(ST.month-1)) : Infinity;
  const loanUnavailable = targetLoanMonthsLeft < LOAN_DURATION_MONTHS;
  if(loanUnavailable && n.loan){ n.loan=false; n.ratio=1.0; }
  const tradeAvailable = !!ctx.sourceTeam;
  if(!tradeAvailable && n.trade){ n.trade=false; }
  if(!n.locked){
    const modeRow=el(`<div class="row" style="margin-bottom:8px;"></div>`);
    const permBtn=el(`<button class="btn btn-sm ${(!n.loan&&!n.trade)?'btn-gold':'btn-ghost'}" style="flex:1;">完全移籍</button>`);
    const loanBtn=el(`<button class="btn btn-sm ${n.loan?'btn-gold':'btn-ghost'}" style="flex:1;${loanUnavailable?'opacity:0.5;':''}">レンタル(${LOAN_DURATION_MONTHS}ヶ月)</button>`);
    const tradeBtn=el(`<button class="btn btn-sm ${n.trade?'btn-gold':'btn-ghost'}" style="flex:1;${tradeAvailable?'':'opacity:0.5;'}">トレード</button>`);
    permBtn.onclick=()=>{ ST.nego.loan=false; ST.nego.trade=false; ST.nego.ratio=1.0; render(); };
    if(!loanUnavailable){
      loanBtn.onclick=()=>{ ST.nego.loan=true; ST.nego.trade=false; ST.nego.ratio=1.0; render(); };
    }
    if(tradeAvailable){
      tradeBtn.onclick=()=>{ ST.nego.trade=true; ST.nego.loan=false; render(); };
    }
    modeRow.appendChild(permBtn); modeRow.appendChild(loanBtn); modeRow.appendChild(tradeBtn);
    m.appendChild(modeRow);
    if(loanUnavailable){
      m.appendChild(el(`<div class="small" style="margin-top:-4px;margin-bottom:8px;color:var(--red);">相手選手の契約残り期間がレンタル期間に満たないため、レンタル移籍は選択できません。</div>`));
    }
  }

  const basePrice = n.loan ? Math.max(1,Math.round(t.price*0.25)) : t.price;

  if(n.trade){
    /* ---- トレード式移籍のUI ---- */
    m.appendChild(el(`<div class="stat-row"><span>相手選手の相場</span><span class="num">$${basePrice}M</span></div>`));
    if(!n.locked){
      const roster=ST.teams[ST.myTeam].roster.filter(x=>!x.loanOriginalTeam);
      m.appendChild(el(`<div class="stat-row" style="margin-bottom:2px;"><span>提示する選手を選択</span></div>`));
      const listWrap=el(`<div style="max-height:160px;overflow-y:auto;margin-bottom:8px;border:1px solid var(--line);border-radius:9px;padding:4px;"></div>`);
      if(!roster.length){
        listWrap.appendChild(el(`<div class="small" style="padding:8px;">トレードに出せる選手がいません。</div>`));
      } else {
        roster.forEach(p=>{
          const val=tradeValue(p);
          const item=el(`<div class="bench-item ${n.tradeOfferId===p.id?'selected':''}" style="margin-bottom:5px;"></div>`);
          item.innerHTML=`<span>${esc(p.pos)} ${esc(p.name)} <span class="small">${p.age}歳 / 総合${total(p)}</span></span><span class="small num">$${val}M相当</span>`;
          item.onclick=()=>{ ST.nego.tradeOfferId = (ST.nego.tradeOfferId===p.id) ? null : p.id; render(); };
          listWrap.appendChild(item);
        });
      }
      m.appendChild(listWrap);

      const offeredPlayer = n.tradeOfferId!=null ? roster.find(x=>x.id===n.tradeOfferId) : null;
      const offeredValue = offeredPlayer ? tradeValue(offeredPlayer) : 0;

      m.appendChild(el(`<div class="stat-row" style="margin-bottom:2px;"><span>現金調整額（相手に追加で支払う場合は+、受け取る場合は-）</span></div>`));
      const cashWrap=el(`<div class="row" style="margin-bottom:4px;align-items:center;gap:6px;"></div>`);
      const dollar2=el(`<span style="font-weight:700;color:var(--text-dim);">$</span>`);
      const cashInput=el(`<input type="number" step="1" value="${n.tradeCash||0}" style="flex:1;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--navy-2);color:var(--text);font-size:16px;font-weight:700;">`);
      const unit2=el(`<span style="font-weight:700;color:var(--text-dim);">M</span>`);
      cashWrap.appendChild(dollar2); cashWrap.appendChild(cashInput); cashWrap.appendChild(unit2);
      m.appendChild(cashWrap);

      const totalWrap=el(`<div class="stat-row" style="margin-bottom:8px;"><span>提示合計額</span><span class="num" id="tradeTotalVal"></span></div>`);
      m.appendChild(totalWrap);

      const meterWrap=el(`<div style="margin-bottom:10px;"></div>`);
      const meterLabelRow=el(`<div class="row" style="justify-content:space-between;margin-bottom:4px;"><span class="small" style="font-weight:700;">オファー成立可能性</span><span class="small num" id="tradeChancePct" style="font-weight:700;"></span></div>`);

      function updateTradeMeter(){

        const totalVal=offeredValue+cash;
        const ratioTrade=clampRatio(basePrice>0 ? totalVal/basePrice : 0);

    function updateMeter(){
      const v=parseInt(input.value,10);

    m.appendChild(meterWrap);
    updateMeter();

    const submit=el(`<button class="btn btn-primary btn-block">この条件で提示する</button>`);
    submit.onclick=()=>{
      const v=parseInt(input.value,10);
      if(!isNaN(v) && v>0){ ST.nego.ratio = clampRatio(v/basePrice); }
      doNegotiate();
    };
    m.appendChild(submit);
  } else {
    const close=el(`<button class="btn btn-ghost btn-block">閉じる</button>`);
    close.onclick=()=>{ ST.nego=null; render(); };
    m.appendChild(close);
  }
  if(n.message) m.appendChild(el(`<div class="small" style="margin-top:10px;color:var(--gold);">${esc(n.message)}</div>`));
  ov.appendChild(m);
  return ov;
}

function ctxHasSourceTeam(n,t){
  const ctx=buildNegoContext(n,t);
  return !!ctx.sourceTeam;
}

/* ---- トレード式移籍の成立判定・実行 ---- */
function canAcquireGoalkeeperFromTeam(sourceTeam, player){
  if(!sourceTeam || !ST.teams[sourceTeam] || !player || player.pos!=="GK") return true;
  const gkCount=ST.teams[sourceTeam].roster.filter(p=>p.pos==="GK").length;
  return gkCount>1;
}

function goalkeeperTransferBlockMessage(sourceTeam, player){
  const club=sourceTeam || "相手クラブ";
  return `${club}はGKが1人しかいないため、そのGKは獲得できません。`;
}

function doTradeNegotiate(){
  if(!isTransferWindowOpen()){ ST.toast="現在は移籍加入期間外です。8〜9月、1〜3月に移籍交渉できます。"; render(); return; }
  const n=ST.nego;
  const t=n.snapshot;
  const roster=ST.teams[ST.myTeam].roster.filter(x=>!x.loanOriginalTeam);
  const offeredPlayer = n.tradeOfferId!=null ? roster.find(x=>x.id===n.tradeOfferId) : null;
  if(!offeredPlayer){ n.message="提示する選手を選択してください。"; render(); return; }
  const ctx=buildNegoContext(n,t);
  const originTeam=ctx.sourceTeam;
  if(!originTeam || !ST.teams[originTeam]){ n.message="対象クラブが見つかりませんでした。"; n.locked=true; render(); return; }
  const basePrice=t.price;
  const offeredValue=tradeValue(offeredPlayer);
  const cash=Number.isFinite(n.tradeCash) ? n.tradeCash : 0;
  const totalVal=offeredValue+cash;
  const ratioTrade=clampRatio(basePrice>0 ? totalVal/basePrice : 0);
  const chance=negoChance(ratioTrade, ctx);
  if(Math.random()<chance){
    if(cash>0 && ST.budget<cash){ n.message="予算不足のため、この条件でのトレードは成立できませんでした。"; n.locked=true; render(); return; }
    if(cash>0 && (Number(ST.budget)||0)<cash) {
      n.message="持ち金が足りないため、トレードできません。"; n.locked=true; render(); return;
    }
    const srcRoster=ST.teams[originTeam].roster;
    const found=srcRoster.find(p=>p.id===t.id);
    if(!found){ n.message="対象選手はすでに移籍していました。"; n.locked=true; render(); return; }
    const currentForeign=foreignCount(ST.myTeam);
    const netForeign = currentForeign - (offeredPlayer.foreign?1:0) + (found.foreign?1:0);
    if(found.foreign && netForeign>5){ n.message="外国籍選手はすでに5人保有しているため、これ以上獲得できません。"; n.locked=true; render(); return; }
    if(ST.teams[ST.myTeam].roster.some(p=>p.id===found.id)){ n.message="この選手はすでに自クラブに所属しています。"; n.locked=true; render(); return; }
    if(!canAcquireGoalkeeperFromTeam(originTeam, found)){
      n.message=goalkeeperTransferBlockMessage(originTeam, found);
      n.locked=true;
      render();
      return;
    }
    if(cash>0 && !spendBudget(cash,"持ち金が足りません。")) { n.message="持ち金が足りないため、トレードできません。"; n.locked=true; render(); return; }
    srcRoster.splice(srcRoster.indexOf(found),1);
    removePlayerFromMyTeam(offeredPlayer);
    srcRoster.push(offeredPlayer);
    offeredPlayer.contractYears=randInt(1,5); offeredPlayer.contractYearsLeft=offeredPlayer.contractYears; offeredPlayer.salary=calcSalary(offeredPlayer, offeredPlayer.contractYears);
    found.contractYears=randInt(1,5); found.contractYearsLeft=found.contractYears; found.salary=calcSalary(found, found.contractYears);
    found.fromTeam=originTeam;
    ST.teams[ST.myTeam].roster.push(found);
    markImportant(originTeam); markImportant(ST.myTeam);
    const cashNote = cash>0 ? `＋$${cash}M支払い` : cash<0 ? `（$${-cash}M受領）` : '';
    n.message = `トレード成立！ ${offeredPlayer.name}${cashNote} と交換で ${found.name} を獲得しました。`;
    addNews(`🔁 ${found.name} を${originTeam}とのトレードで獲得しました（放出：${offeredPlayer.name}）。`);
    n.locked=true;
  } else {
    if(Math.random()<0.3){
      n.message="交渉決裂...相手クラブが条件を拒否しました。";
      n.locked=true;
    } else {
      n.message="提示を拒否されました。条件を見直して再交渉できます。";
    }
  }
  render();
}

function doNegotiate(){
  if(!isTransferWindowOpen()){ ST.toast="現在は移籍加入期間外です。8〜9月、1〜3月に移籍交渉できます。"; render(); return; }
  const n=ST.nego, t=n.snapshot;
  if(t && negotiationLocked(t)){
    n.message=`この選手とはあと${negotiationRemainingMonths(t)}ヶ月、加入交渉できません。`;
    n.locked=true; render(); return;
  }
  if(n.loan){
    const monthsLeft=t.contractYearsLeft!=null ? Math.max(0,t.contractYearsLeft*12-(ST.month-1)) : Infinity;
    if(monthsLeft<LOAN_DURATION_MONTHS){ n.loan=false; n.ratio=1.0; }
  }
  if(n.trade && !ctxHasSourceTeam(n,t)){ n.trade=false; }
  if(n.trade){ doTradeNegotiate(); return; }
  const basePrice=n.loan ? Math.max(1,Math.round(t.price*0.25)) : t.price;
  n.ratio=clampRatio(n.ratio);
  const minPrice=Math.max(1,Math.round(basePrice*NEGO_MIN_RATIO));
  const maxPrice=Math.max(minPrice,Math.round(basePrice*NEGO_MAX_RATIO));
  const offerPrice=Math.max(minPrice,Math.min(maxPrice,Math.round(basePrice*n.ratio)));
  const ctx=buildNegoContext(n,t), chance=negoChance(n.ratio,ctx);
  if(Math.random()>=chance){
    if(Math.random()<0.3){
      if(n.source==='market' && n.idx<ST.market.length && !ST.market[n.idx].sourceTeam) ST.market.splice(n.idx,1);
      n.message="移籍金交渉が決裂しました。"; n.locked=true;
    } else n.message="移籍金の提示を拒否されました。条件を見直して再交渉できます。";
    render(); return;
  }
  if(ST.budget<offerPrice || ST.teams[ST.myTeam].roster.length>=30){ n.message="予算不足、または選手枠が上限のため獲得できません。"; n.locked=true; render(); return; }

  let player=null, sourceTeam=null, removedFromMarket=false;
  if(n.source==='market'){
    const entry=ST.market[n.idx];
    if(!entry || entry.id!==t.id){ n.message="対象選手はすでに移籍していました。"; n.locked=true; render(); return; }
    sourceTeam=entry.sourceTeam||null;
    if(sourceTeam && ST.teams[sourceTeam]){
      player=ST.teams[sourceTeam].roster.find(p=>p.id===entry.id);
      if(!player){ n.message="対象選手はすでに移籍していました。"; n.locked=true; render(); return; }
      if(!canAcquireGoalkeeperFromTeam(sourceTeam,player)){ n.message=goalkeeperTransferBlockMessage(sourceTeam,player); n.locked=true; render(); return; }
    } else {
      player={...entry}; delete player.sourceTeam; player.price=undefined; ST.market.splice(n.idx,1); removedFromMarket=true;
    }
  } else {
    sourceTeam=ST.scoutTeam;
    const sr=ST.teams[sourceTeam]?.roster||[];
    player=sr.find(p=>p.id===t.id);
    if(!player){ n.message="対象選手はすでに移籍していました。"; n.locked=true; render(); return; }
    if(!canAcquireGoalkeeperFromTeam(sourceTeam,player)){ n.message=goalkeeperTransferBlockMessage(sourceTeam,player); n.locked=true; render(); return; }
  }
  if(!player){ n.message="対象選手を取得できませんでした。"; n.locked=true; render(); return; }
  if(player.foreign && foreignCount(ST.myTeam)>=5){ n.message="外国籍選手はすでに5人保有しているため、これ以上獲得できません。"; n.locked=true; if(removedFromMarket) ST.market.push({...player}); render(); return; }
  ST.nego=null;
  ST.salaryNegotiation={player,source:n.source,sourceTeam,transferFee:offerPrice,years:Math.min(3,Math.max(1,player.contractYears||1)),salary:Math.max(1,calcSalary(player,Math.min(3,Math.max(1,player.contractYears||1)))),message:`移籍金 $${offerPrice}M の交渉が成立しました。次に年俸・契約年数を交渉してください。`,locked:false,loan:!!n.loan,removedFromMarket};
  if(sourceTeam) markImportant(sourceTeam);
  render();
}

      // buildFixtureSchedule() / normalizeLoadedState() 側でリーグ日程を保証する。
      if(!ST.offers || !Array.isArray(ST.offers)) ST.offers=[];
      if(!ST.teamStats || typeof ST.teamStats!=="object") ST.teamStats={};
      Object.keys(ST.teams||{}).forEach(t=>{
        if(!ST.teamStats[t]) ST.teamStats[t]={pts:0,w:0,d:0,l:0,gf:0,ga:0};
        else {
          const x=ST.teamStats[t];
          x.pts=Number(x.pts)||0; x.w=Number(x.w)||0; x.d=Number(x.d)||0; x.l=Number(x.l)||0;
          x.gf=Number(x.gf)||0; x.ga=Number(x.ga)||0;
        }
      });
      buildFixtureSchedule();
      const fixture=ST.fixtureSchedule?.find(x=>Number(x.week)===Number(ST.week));
      if(!fixture || (fixture.type!=="league" && fixture.type!=="cup")){
        throw new Error("試合日程を取得できませんでした（現在週="+(ST.week||1)+"）");
      }
      // ここでは画面状態を先にhomeへ変更しない。resolveWeek()が現在の試合日程を参照するため。
      resolveWeek(null);
      if(ST.screen==="prematch") ST.screen="home";
      render();
    }catch(err){
      console.error("match start failed:",err);
      ST.screen="home";
      ST.toast="試合処理エラー："+(err?.message||"原因不明");
      try{ render(); }catch(_){ }
    }
  };
  row.appendChild(edit); row.appendChild(go);
  m.appendChild(row);
  ov.appendChild(m);
  return ov;
}

function ensureAchievements(){
  if(!ST) return;
  if(!ST.achievements || typeof ST.achievements!=='object') ST.achievements={titles:[],individual:[],records:{}};
  if(!Array.isArray(ST.achievements.titles)) ST.achievements.titles=[];
  if(!Array.isArray(ST.achievements.individual)) ST.achievements.individual=[];
  if(!ST.achievements.records || typeof ST.achievements.records!=='object') ST.achievements.records={};
  if(!ST.achievementTab) ST.achievementTab='titles';
}
function achievementPlayers(){
  ensureAchievements();
  const map=new Map();
  Object.values(ST.teams||{}).forEach(t=>(t.roster||[]).forEach(p=>{
    if(!p||!p.id) return;
    const old=ST.achievements.records[p.id]||{};
    map.set(p.id,{id:p.id,name:p.name,team:t===ST.teams[ST.myTeam]?ST.myTeam:Object.keys(ST.teams).find(k=>ST.teams[k]===t)||'',pos:p.pos,games:p.games||0,goals:p.goals||0,assists:p.assists||0,history:Array.isArray(p.history)?p.history:[],awards:old.awards||0});
  }));
  return map;
}
function recordSeasonAchievements(){
  ensureAchievements();
  const completedSeason=ST.season;
  const rosterEntries=[];
  Object.keys(ST.teams||{}).forEach(team=>{
    (ST.teams[team].roster||[]).forEach(p=>{
      const games=(p.games||0)-(p._baseGames||0), goals=(p.goals||0)-(p._baseGoals||0), assists=(p.assists||0)-(p._baseAssists||0);
      const rec=ST.achievements.records[p.id]||{id:p.id,name:p.name,pos:p.pos,games:0,goals:0,assists:0,awards:0,seasonBest:0};
      rec.name=p.name; rec.pos=p.pos; rec.games=Math.max(rec.games||0,p.games||0); rec.goals=Math.max(rec.goals||0,p.goals||0); rec.assists=Math.max(rec.assists||0,p.assists||0);
      rec.team=team; rec.seasonBest=Math.max(rec.seasonBest||0,goals);
      ST.achievements.records[p.id]=rec;
      if(games>0||goals>0||assists>0) rosterEntries.push({p,team,games,goals,assists});
    });
  });
  const div=ST.teams[ST.myTeam]?.division||ST.myDivision||'J1';
  const ranked=sortedDivision(div);
  const leagueChampion=sortedDivision('J1')[0];
  if(leagueChampion===ST.myTeam){
    ST.achievements.titles.push({season:completedSeason,competition:'J1リーグ',icon:'🏆',detail:'リーグ優勝'});
  }
  ['emperor','levain'].forEach(k=>{
    const cup=ST.cups?.[k];
    if(cup?.champion===ST.myTeam) ST.achievements.titles.push({season:completedSeason,competition:cup.name,icon:'🏆',detail:'大会優勝'});
  });
  // 既存セーブで同一シーズンを二重登録しない
  const seen=new Set();
  ST.achievements.titles=ST.achievements.titles.filter(t=>{const key=`${t.season}_${t.competition}`;if(seen.has(key))return false;seen.add(key);return true;});

  if(rosterEntries.length){
    let top=rosterEntries.filter(x=>x.goals>0).sort((a,b)=>b.goals-a.goals)[0];
    if(top){
      ST.achievements.individual.push({season:completedSeason,type:'得点王',name:top.p.name,team:top.team,pos:top.p.pos,value:top.goals});
      const r=ST.achievements.records[top.p.id]; if(r) r.awards=(r.awards||0)+1;
    }
    const slots={GK:1,DF:4,MF:3,FW:3};
    Object.keys(slots).forEach(pos=>{
      rosterEntries.filter(x=>x.p.pos===pos).sort((a,b)=>(total(b.p)+b.goals*3+b.assists*2)-(total(a.p)+a.goals*3+a.assists*2)).slice(0,slots[pos]).forEach(x=>{
        ST.achievements.individual.push({season:completedSeason,type:'ベストイレブン',name:x.p.name,team:x.team,pos:x.p.pos,value:x.goals});
        const r=ST.achievements.records[x.p.id]; if(r) r.awards=(r.awards||0)+1;
      });
    });
  }
  if(ST.achievements.individual.length>100) ST.achievements.individual.splice(0,ST.achievements.individual.length-100);
  // 自クラブ在籍者のキャリア記録を名前付きで固定保存（移籍・引退後もキャビネットに残す）
  Object.keys(ST.teams||{}).forEach(team=>(ST.teams[team].roster||[]).forEach(p=>{
    const r=ST.achievements.records[p.id]; if(r){r.name=p.name;r.pos=p.pos;r.games=p.games||0;r.goals=p.goals||0;r.assists=p.assists||0;}
  }));
}

/* ========================= SAVE / LOAD（アプリ内・3スロット） ========================= */
const SAVE_SLOT_COUNT=3;
const SAVE_KEY_PREFIX="j1manager_slot_";

function getSaveSlotInfo(n){
  try{
    const raw=localStorage.getItem(SAVE_KEY_PREFIX+n);
    if(!raw) return null;
    const parsed=JSON.parse(raw);
    if(!parsed || !parsed.state) return null;
    return parsed;
  }catch(err){ return null; }
}

function saveToSlot(n){
  try{
    const record={
      savedAt:Date.now(),
      meta:{ team:ST.myTeam, division:ST.myDivision, season:ST.season, month:actualMonth(), seasonMonth:ST.month, week:ST.week },
      state:ST
    };
    localStorage.setItem(SAVE_KEY_PREFIX+n, JSON.stringify(record));
    ST.toast=`スロット${n}にセーブしました。`;
    ST.saveSlotModal=null;
    render();
  }catch(err){
    ST.toast="セーブに失敗しました（保存容量が不足している可能性があります）。";
    render();
  }
}

function loadFromSlot(n){
  const rec=getSaveSlotInfo(n);
  if(!rec || !rec.state || !rec.state.teams || !rec.state.myTeam){
    ST.toast="このスロットにはセーブデータがありません。";
    render();
    return;
  }
  ST=rec.state;
  ST.managerLevel=ST.managerLevel||1;
  ST.negotiationLocks=ST.negotiationLocks||{};
  Object.values(ST.teams||{}).forEach(t=>(t.roster||[]).forEach(p=>{ if(p.negotiationUnlockAt && p.id) ST.negotiationLocks[p.id]=p.negotiationUnlockAt; }));
  if(!Object.prototype.hasOwnProperty.call(ST,"managerRequest")) ST.managerRequest=null;
  ST.captainId=ST.captainId||null;
  Object.values(ST.teams||{}).forEach(t=>(t.roster||[]).forEach(ensurePlayerSkills));
  ST.showFormationPopup=false; ST.showOffers=false; ST.nego=null; ST.contractModal=null; ST.salaryNegotiation=null; ST.showNewsModal=false; ST.matchResultModal=null; ST.retirementModal=null;
  ST.saveSlotModal=null; ST.showSponsorModal=false;
  if(ST.screen==="prematch"||ST.screen==="training") ST.screen="home";
  ST.toast=`スロット${n}を読み込みました。`;
  render();
}

function deleteSlot(n){
  const info=getSaveSlotInfo(n);
  if(!ST.saveSlotModal) ST.saveSlotModal={mode:"load",pendingSlot:null};
  ST.saveSlotModal.deleteConfirm=n;
  ST.saveSlotModal.deleteInfo=info;
  render();
}

function openSaveSlotModal(mode){
  const modal={mode, pendingSlot:null};
  ST.saveSlotModal=modal;
  render();
}

function saveMetaMonth(info){
  const sm=Number(info?.meta?.seasonMonth);
  if(Number.isFinite(sm)&&sm>=1&&sm<=12) return SEASON_MONTHS[sm-1];
  const stateMonth=Number(info?.state?.month);
  if(Number.isFinite(stateMonth)&&stateMonth>=1&&stateMonth<=12) return SEASON_MONTHS[stateMonth-1];
  return Number(info?.meta?.month)||'';
}

function fmtSaveDate(ts){
  const d=new Date(ts);
  const p=(x)=>String(x).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

  const modal=ST.saveSlotModal;
  const ov=el(`<div class="modal-overlay"></div>`);
  const m=el(`<div class="modal center"><div class="modal-title">${modal.mode==='save'?'💾 セーブ（3スロットまで）':'📂 ロード（3スロットまで）'}</div></div>`);

    const row=el(`<div class="row"></div>`);

      ST.saveSlotModal.deleteConfirm=null;

  if(modal.pendingSlot!=null){

    row.appendChild(ok); row.appendChild(cancel);
    m.appendChild(row);
    ov.appendChild(m);

  }

  for(let n=1;n<=SAVE_SLOT_COUNT;n++){
    const info=getSaveSlotInfo(n);
    const card=el(`<div class="list-item" style="align-items:center;"></div>`);
    if(info){
      card.innerHTML=`<div>
        <div class="pname">スロット${n}：${esc(info.meta.team||'')}</div>
        <div class="pmeta">${esc(info.meta.division||'')} ・ S${info.meta.season} ${saveMetaMonth(info)}月 第${info.meta.week}週</div>
        <div class="small">${fmtSaveDate(info.savedAt)}</div>
      </div>`;
    } else {
      card.innerHTML=`<div><div class="pname">スロット${n}</div><div class="small">空き</div></div>`;
    }
    const btnRow=el(`<div style="display:flex;gap:6px;"></div>`);
    if(modal.mode==="save"){
      const b=el(`<button class="btn btn-sm ${info?'btn-ghost':'btn-gold'}">${info?'上書き':'セーブ'}</button>`);
      b.onclick=()=>{ if(info){ ST.saveSlotModal.pendingSlot=n; render(); } else { saveToSlot(n); } };
      btnRow.appendChild(b);
    } else {
      const b=el(`<button class="btn btn-sm btn-gold">読込</button>`);
      b.disabled=!info;

      btnRow.appendChild(b);

        del.onclick=(e)=>{ e.stopPropagation(); deleteSlot(n); };
        btnRow.appendChild(del);
      }
    }
    card.appendChild(btnRow);
    m.appendChild(card);
  }

  const close=el(`<button class="btn btn-ghost btn-block" style="margin-top:12px;">閉じる</button>`);
  close.onclick=()=>{ ST.saveSlotModal=null; render(); };
  m.appendChild(close);
  ov.appendChild(m);
  ov.onclick=(e)=>{ if(e.target===ov){ ST.saveSlotModal=null; render(); } };
  return ov;
}

  /* ---- 順位表：得点・失点を追加 ---- */
  renderStandings=function(){

  renderPlayerDetail=function(){

  /* ---- クラブハウスLv：練習効果を強化 ---- */
  const CLUBHOUSE_LEVELS={
    1:{bonus:0,cost:0},
    2:{bonus:10,cost:360},
    3:{bonus:20,cost:720},
    4:{bonus:30,cost:1200},
    5:{bonus:40,cost:1800}
  };
  function clubhouseLevelData(){ return CLUBHOUSE_LEVELS[Math.max(1,Math.min(5,ST.clubhouseLevel||1))]||CLUBHOUSE_LEVELS[1]; }

  /* ---- ダービー：地域ライバル戦は勝敗をクラブの勢い・ファン動員に強く反映 ---- */
  function applyDerbyEffect(home,away,hs,as){
    if(!ST.myTeam || (home!==ST.myTeam && away!==ST.myTeam)) return null;
    const derby=getDerbyInfo(home,away);
    if(!derby) return null;
    const myScore=home===ST.myTeam?hs:as;
    const oppScore=home===ST.myTeam?as:hs;
    const roster=ST.teams[ST.myTeam]?.roster||[];
    let result='draw', fanDelta=800, conditionDelta=0;
    if(myScore>oppScore){ result='win'; fanDelta=4500; conditionDelta=1; }
    else if(myScore<oppScore){ result='loss'; fanDelta=-1200; conditionDelta=-1; }
    roster.forEach(p=>{ p.condition=Math.max(0,Math.min(4,(p.condition==null?2:p.condition)+conditionDelta)); });
    ST.fans=Math.max(5000,Math.min(500000,(ST.fans||0)+fanDelta));
    ST.derbyStats=ST.derbyStats||{wins:0,draws:0,losses:0,played:0,history:[]};
    ST.derbyStats.played++; ST.derbyStats[result==='win'?'wins':result==='loss'?'losses':'draws']++;
    ST.derbyStats.history.unshift({season:ST.season,month:ST.month,week:ST.week,name:derby[2],opponent:home===ST.myTeam?away:home,score:`${hs}-${as}`,result});
    ST.derbyStats.history=ST.derbyStats.history.slice(0,10);
    addNews(`🔥 ${derby[2]}：${home} ${hs}-${as} ${away}。${result==='win'?'ダービー勝利！チームの調子が上昇し、ファンが大きく増えました。':result==='loss'?'ダービー敗戦…。チームの調子が低下し、ファンが減少しました。':'ダービーは引き分け。ファンが少し増えました。'}`);
    return {name:derby[2],result,fanDelta,conditionDelta};
  }

  /* ---- スタジアム改修・ファン数・今後の日程 ---- */
  renderHome=function(){
    ensureExpansionState();
    const wrap=_renderHome();

    // ホームのレベルアップ要素を「施設・スタッフ強化」に集約
    const levelCard=el(`<div class="card"><div class="section-title">🔧 施設・スタッフ強化</div><div class="small" style="margin-bottom:8px;">クラブの設備・スタッフをまとめて強化できます。</div></div>`);

      if(lv>=5) return;

      const ov=el(`<div class="modal-overlay upgrade-confirm-overlay" style="z-index:120;align-items:center;padding:16px;"></div>`);
      const m=el(`<div class="modal center" style="width:100%;max-width:390px;background:linear-gradient(180deg,#132A44 0%,#0F2439 100%);border:1px solid rgba(242,183,5,.35);box-shadow:0 18px 50px rgba(0,0,0,.45);padding:20px;"></div>`);
      m.appendChild(el(`<div style="text-align:center;font-size:11px;font-weight:800;letter-spacing:2px;color:var(--text-dim);margin-bottom:5px;">CLUB DEVELOPMENT</div>`));
      m.appendChild(el(`<div class="modal-title" style="text-align:center;font-size:21px;margin-bottom:14px;">🔧 ${esc(name)} 強化</div>`));
      const levels=el(`<div style="display:flex;align-items:center;justify-content:center;gap:12px;margin:8px 0 18px;"><div style="text-align:center;"><div class="small">現在</div><div class="num" style="font-size:30px;color:var(--text);font-weight:700;">Lv.${lv}</div></div><div style="font-size:24px;color:var(--gold);">▶</div><div style="text-align:center;"><div class="small">強化後</div><div class="num" style="font-size:30px;color:var(--gold);font-weight:700;">Lv.${next}</div></div></div>`);
      m.appendChild(levels);
      m.appendChild(el(`<div style="background:rgba(4,16,29,.55);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;"><div class="stat-row"><span>強化費用</span><span class="num" style="color:var(--gold);font-size:17px;">$${cost}M</span></div><div class="stat-row"><span>現在の予算</span><span class="num">$${ST.budget}M</span></div><div class="stat-row" style="border-bottom:0;"><span>強化後の予算</span><span class="num">$${ST.budget-cost}M</span></div></div>`));
      m.appendChild(el(`<div class="small" style="text-align:center;margin-bottom:14px;">この強化を実行しますか？</div>`));
      const buttons=el(`<div class="grid2" style="gap:8px;"></div>`);
      const cancel=el(`<button class="btn btn-ghost">キャンセル</button>`);
      const ok=el(`<button class="btn btn-gold">強化する</button>`);
      cancel.onclick=()=>ov.remove();
      ok.onclick=()=>{
        if(ST.budget<cost){ ov.remove(); ST.toast='予算が不足しています。'; render(); return; }
        ov.remove();
        onConfirm();
      };
      buttons.appendChild(cancel); buttons.appendChild(ok); m.appendChild(buttons);
      ov.appendChild(m); document.body.appendChild(ov);
    };
    const addLevelRow=(icon,name,lv,desc,cost,handler)=>{
      const row=el(`<div class="stat-row" style="display:block;margin-top:7px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);"><div><b>${icon} ${name} Lv.${lv}</b></div><div class="small" style="margin:4px 0 7px;">${desc}</div></div>`);
      const btn=el(`<button class="btn btn-gold btn-block">${lv>=5?'Lv.5（最大）':`Lv.${lv} → Lv.${lv+1}（$${cost}M）`}</button>`);
      btn.disabled=lv>=5;
      btn.onclick=()=>{ if(lv<5 && (Number(ST.budget)||0)<cost){ ST.toast=`持ち金が足りません。$${cost}M必要です。`; render(); return; } handler(); };
      row.appendChild(btn); levelList.appendChild(row);
    };
    const mlv=Math.max(1,Math.min(5,ST.medicalLevel||1));
    const mnextCost=[0,600,1200,2100,3600][mlv]||0;
    const md=medicalLevelData();
    addLevelRow('🏥','医療班',mlv,`疲労蓄積 ${Math.round((1-md.fatigueRate)*100)}%軽減 ／ 怪我発生率 ${Math.round((1-md.injuryRate)*100)}%軽減`,mnextCost,()=>{
      confirmPaidLevelUp('医療班',mlv,mlv+1,mnextCost,()=>{ const c=mnextCost; if(!spendBudget(c,"持ち金が足りません。")){ render(); return; } ST.medicalLevel=mlv+1; addNews(`🏥 医療班をLv.${mlv+1}へ強化しました。`); render(); });
    });
    const clv=Math.max(1,Math.min(5,ST.clubhouseLevel||1));
    const cd=clubhouseLevelData();
    const cnextCost=clv<5 ? CLUBHOUSE_LEVELS[clv+1].cost : 0;
    addLevelRow('🏢','クラブハウス',clv,`練習効果 +${cd.bonus}%`,cnextCost,()=>{
      if(clv>=5)return; const c=CLUBHOUSE_LEVELS[clv+1].cost; confirmPaidLevelUp('クラブハウス',clv,clv+1,c,()=>{ if(!spendBudget(c,"持ち金が足りません。")) { render(); return; } ST.clubhouseLevel=clv+1; addNews(`🏢 クラブハウスをLv.${clv+1}へ改修しました。練習効果+${CLUBHOUSE_LEVELS[clv+1].bonus}%`); render(); });
    });
    const ylv=Math.max(1,Math.min(5,ST.youthCoachLevel||1));
    const ynextCost=ylv<5 ? ([250,500,1000,2000][ylv-1]||2000) : 0;
    const eliteRate=[0,4,7,10,14,20][ylv]||4;
    addLevelRow('🧑‍🏫','ユースコーチ',ylv,`ユース選手能力補正・エリート候補出現率 最大${eliteRate}%`,ynextCost,()=>{
      if(ylv>=5)return; const c=ynextCost; confirmPaidLevelUp('ユースコーチ',ylv,ylv+1,c,()=>{ if(!spendBudget(c,"持ち金が足りません。")) { render(); return; } ST.youthCoachLevel=ylv+1; addNews(`🧑‍🏫 ユースコーチをLv.${ylv+1}に強化`); if(window.__J1_AUTO_SAVE) window.__J1_AUTO_SAVE(); render(); });
    });
    levelCard.appendChild(levelList);

    const infra=el(`<div class="card"><div class="section-title">🏟️ スタジアム・ファン</div>
      <div class="stat-row"><span>ファン数</span><span class="num">${(ST.fans||0).toLocaleString()}人</span></div>
      <div class="stat-row"><span>スタジアム</span><span class="num">Lv${ST.stadiumLevel}（収容${ST.stadiumCapacity.toLocaleString()}人）</span></div>
      <div class="small" style="margin:8px 0;">改修すると収容人数と試合収益が増加します。</div></div>`);
    const upgradeCost=360*(ST.stadiumLevel||1);
    const ub=el(`<button class="btn btn-gold btn-block">🏗️ スタジアム改修（${formatMoney(upgradeCost)}）</button>`);
    ub.disabled=ST.stadiumLevel>=5;
    ub.onclick=()=>{
      if(ST.stadiumLevel>=5) return;
      if((Number(ST.budget)||0)<upgradeCost){ ST.toast=`持ち金が足りません。$${upgradeCost}M必要です。`; render(); return; }
      confirmPaidLevelUp('スタジアム',ST.stadiumLevel,ST.stadiumLevel+1,upgradeCost,()=>{
        if(!spendBudget(upgradeCost,"持ち金が足りません。")) { render(); return; } ST.stadiumLevel++; ST.stadiumCapacity=20000+(ST.stadiumLevel-1)*10000;

    infra.appendChild(ub);

    // スタッフ強化は「スタジアム・ファン」の直下に配置
    wrap.appendChild(levelCard);

    const sched=el(`<div class="card"><div class="section-title">📅 今後の試合日程</div></div>`);
    getNextFixtures().slice(0,8).forEach(f=>{

      sched.appendChild(el(`<div class="stat-row"><span>第${f.week}週　${label}</span><span style="${cls}" class="num">${esc(f.competition)}${f.opponent&&f.opponent!=='カップ戦'?` vs ${esc(f.opponent)}`:''}</span></div>`));
    });
    wrap.appendChild(sched);

    const myDerbies=ALL_DERBIES.filter(d=>d[0]===ST.myTeam||d[1]===ST.myTeam);
    if(myDerbies.length){

      myDerbies.forEach(d=>{

      });
      const ds=ST.derbyStats||{wins:0,draws:0,losses:0};
      dc.appendChild(el(`<div class="small" style="margin-top:8px;">通算ダービー：${ds.wins}勝 ${ds.draws}分 ${ds.losses}敗<br>勝利すると全選手の調子が上がり、ファンが大きく増加します。</div>`));
      wrap.appendChild(dc);
    }

    return wrap;
  };

  /* ---- 日程進行後に8週ごとの日程を更新 ---- */
  resolveWeek=function(matchResultsHolder){
    ensureExpansionState();
    const beforeWeek=ST.week;
    const beforeMonth=ST.month;
    // 6月・第8週の処理に入る直前がシーズン記録確定タイミング。
    if(isSeasonEndMonth() && beforeWeek===8) recordSeasonAchievements();
    _resolveWeek(matchResultsHolder);
    if(ST.week!==beforeWeek){
      if(ST.week===1 || ST.month!==beforeMonth) buildFixtureSchedule();
      else if(ST.fixtureSchedule){
        const current=ST.fixtureSchedule.find(f=>f.week===beforeWeek);
        if(current && current.type==='cup') current.played=true;
      }
    }
  };

  // 元のロード関数を上書きする前に退避しておく。
  // 以前の版では _loadFromSlot という未定義関数を呼んでしまい、
  // 読込ボタンを押すと例外になってロードできない不具合が発生していた。
  const _originalLoadFromSlot = loadFromSlot;
  loadFromSlot=function(n){
    try{
      const rec=getSaveSlotInfo(n);
      if(!rec || !rec.state || !rec.state.teams || !rec.state.myTeam){
        if(ST){ ST.toast="このスロットには有効なセーブデータがありません。"; render(); }
        return false;
      }
      _originalLoadFromSlot(n);
      // ロード直後に新機能・旧セーブ互換の初期化を必ず実行。
      normalizeLoadedState();
      ensureExpansionState();
      ensureManagerState();
      ST.saveSlotModal=null;
      ST.showFormationPopup=false;
      ST.showOffers=false;
      ST.nego=null;
      ST.contractModal=null;
      ST.salaryNegotiation=null;
      ST.showNewsModal=false;
      ST.matchResultModal=null;
      ST.retirementModal=null;
      ST.toast=`スロット${n}を読み込みました。`;
      render();
      return true;
    }catch(e){
      console.error("loadFromSlot error",e);
      // 元データを壊さないよう、失敗時は現在の状態を維持する。
      if(ST){ ST.saveSlotModal=null; ST.toast="セーブデータの読み込みに失敗しました。データは変更していません。"; render(); }
      return false;
    }
  };

  // 新規ゲーム直後にも初期化。
  ensureExpansionState();
})();

/* ========================= AUTO SAVE / TIMING / SAFETY PATCH =========================
   - Autosave after every turn and successful acquisition.
   - Autosave is separate from manual slots.
   - Youth promotion is immediate and not tied to the transfer window.
*/
(function(){
  const AUTO_SAVE_KEY="j1manager_autosave_v2";
  function autoSave(){
    try{
      if(!ST || !ST.myTeam || !ST.teams || !ST.teams[ST.myTeam]) return;
      const record={savedAt:Date.now(),meta:{team:ST.myTeam,division:ST.myDivision,season:ST.season,month:actualMonth(),seasonMonth:ST.month,week:ST.week},state:ST};
      localStorage.setItem(AUTO_SAVE_KEY,JSON.stringify(record));
      ST.lastAutoSavedAt=record.savedAt;
    }catch(e){ console.warn("autoSave failed",e); }
  }
  window.__J1_AUTO_SAVE=autoSave;
  window.__J1_AUTO_SAVE_KEY=AUTO_SAVE_KEY;

  const oldAdvanceWeek=advanceWeek;
  advanceWeek=function(){
    oldAdvanceWeek();
    autoSave();
  };

  const oldResolveWeek=resolveWeek;
  resolveWeek=function(matchResultsHolder){
    oldResolveWeek(matchResultsHolder);
    autoSave();
  };

  const oldCompleteNewPlayerContract=completeNewPlayerContract;
  completeNewPlayerContract=function(){
    const before=ST.teams[ST.myTeam]?.roster?.length||0;
    oldCompleteNewPlayerContract();
    const after=ST.teams[ST.myTeam]?.roster?.length||0;
    if(after>before) autoSave();
  };

  const oldExecuteMarketBuyout=executeMarketBuyout;
  executeMarketBuyout=function(idx){
    const before=ST.teams[ST.myTeam]?.roster?.length||0;
    oldExecuteMarketBuyout(idx);
    const after=ST.teams[ST.myTeam]?.roster?.length||0;
    if(after>before) autoSave();
  };

  const oldDoTradeNegotiate=doTradeNegotiate;
  doTradeNegotiate=function(){
    const before=ST.teams[ST.myTeam]?.roster?.length||0;
    oldDoTradeNegotiate();
    const after=ST.teams[ST.myTeam]?.roster?.length||0;
    if(after>before) autoSave();
  };

  const oldDoNegotiate=doNegotiate;
  doNegotiate=function(){
    // Successful transfer-fee negotiation does not yet mean acquisition;
    // the actual acquisition is autosaved by completeNewPlayerContract.
    oldDoNegotiate();
  };

  const oldRenderSaveSlotModal=renderSaveSlotModal;
  renderSaveSlotModal=function(){
    const ov=oldRenderSaveSlotModal();
    if(ST.saveSlotModal && ST.saveSlotModal.mode==='load'){
      try{
        const raw=localStorage.getItem(AUTO_SAVE_KEY);
        if(raw){
          const rec=JSON.parse(raw);
          const m=ov.querySelector('.modal');
          if(m){
            const card=el('<div class="list-item" style="align-items:center;border:1px solid var(--gold);margin-bottom:8px;"></div>');
            card.innerHTML=`<div><div class="pname">⚡ オートセーブ</div><div class="pmeta">${esc(rec.meta?.division||'')} ・ S${rec.meta?.season||''} ${saveMetaMonth(rec)}月 第${rec.meta?.week||''}週</div><div class="small">${fmtSaveDate(rec.savedAt)}</div></div>`;
            const b=el('<button class="btn btn-sm btn-gold">読込</button>');
            b.onclick=()=>{
              try{
                ST=rec.state; normalizeLoadedState(); ensureManagerState(); ST.saveSlotModal=null; ST.showFormationPopup=false; ST.showOffers=false; ST.nego=null; ST.contractModal=null; ST.salaryNegotiation=null; ST.showNewsModal=false; ST.matchResultModal=null; ST.retirementModal=null; ST.toast='オートセーブを読み込みました。'; render();
              }catch(e){ ST.toast='オートセーブの読み込みに失敗しました。'; render(); }
            };
            card.appendChild(b);
            m.insertBefore(card,m.children[1]||null);
          }
        }
      }catch(e){}
    }
    return ov;
  };

  // Existing saved games get an autosave immediately after normalization.
  try{ if(ST && ST.myTeam && ST.teams?.[ST.myTeam]) autoSave(); }catch(e){}
})();


/* ========================= FINAL GAMEPLAY BALANCE / SEASON FLOW PATCH ========================= */
(function(){
  // ---------- ポジション別の歴代記録 ----------
  const _oldRenderAchievementsFinal=renderAchievements;
  renderAchievements=function(){
    ensureAchievements();
    const wrap=_oldRenderAchievementsFinal();
    if(ST.achievementTab!=='records') return wrap;
    const records=Object.values(ST.achievements.records||{});
    const myIds=new Set((ST.teams[ST.myTeam]?.roster||[]).map(p=>p.id));
    const mine=records.filter(r=>myIds.has(r.id)||r.team===ST.myTeam);
    const best=(arr,key,filter=()=>true)=>arr.filter(filter).sort((a,b)=>(Number(b[key])||0)-(Number(a[key])||0))[0];
    const gk=best(mine,'games',r=>r.pos==='GK');
    const df=best(mine,'games',r=>r.pos==='DF');
    const mfA=best(mine,'assists',r=>r.pos==='MF');
    const fwG=best(mine,'goals',r=>r.pos==='FW');
    const card=el(`<div class="card"><div class="section-title">📌 ポジション別の歴代記録</div>
      <div class="small" style="margin-bottom:8px;">ポジションごとに、その役割に合った通算記録を表示します。</div></div>`);
    const rows=[
      ['🧤 GK','最多出場',gk, gk?`${gk.games}試合`:'—'],
      ['🛡️ DF','最多出場',df, df?`${df.games}試合`:'—'],
      ['🎯 MF','最多アシスト',mfA, mfA?`${mfA.assists}アシスト`:'—'],
      ['⚡ FW','最多得点',fwG, fwG?`${fwG.goals}得点`:'—']
    ];
    rows.forEach(([pos,label,r,val])=>card.appendChild(el(`<div class="stat-row"><span>${pos} ${label}<br><span class="small">${r?esc(r.name):'記録なし'}</span></span><span class="num">${val}</span></div>`)));
    wrap.appendChild(card);
    return wrap;
  };

  // ---------- リーグ戦：完全なホーム＆アウェイ総当たり ----------
  function rrSchedule(teamNames){
    const teams=[...teamNames];
    if(teams.length<2) return [];
    const dummy='__BYE__';
    if(teams.length%2) teams.push(dummy);
    const n=teams.length, rounds=n-1, half=n/2;
    let arr=teams.slice();
    const first=[];
    for(let r=0;r<rounds;r++){
      const matches=[];
      for(let i=0;i<half;i++){
        const a=arr[i], b=arr[n-1-i];
        if(a!==dummy && b!==dummy){
          const home=(r%2===0)?a:b;
          const away=(r%2===0)?b:a;
          matches.push({home,away});
        }
      }
      first.push(matches);
      arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
    }
    const second=first.map(round=>round.map(m=>({home:m.away,away:m.home})));
    return [...first,...second];
  }
  function ensureLeagueSchedule(){
    if(!ST) return;
    const divs=['J1','J2','J3'];
    if(!ST.leagueSchedules || typeof ST.leagueSchedules!=='object') ST.leagueSchedules={};
    divs.forEach(div=>{
      const names=Object.keys(ST.teams||{}).filter(t=>ST.teams[t].division===div);
      const sig=names.slice().sort().join('|');
      const cur=ST.leagueSchedules[div];
      if(!cur || cur.signature!==sig || !Array.isArray(cur.rounds) || cur.rounds.length!==Math.max(0,(names.length-1)*2)){
        ST.leagueSchedules[div]={signature:sig,rounds:rrSchedule(names),played:[]};
      }
    });
    if(ST.leagueMatchSlot==null) ST.leagueMatchSlot=0;
  }
  function roundForSlot(div,slot){
    ensureLeagueSchedule();
    const rounds=ST.leagueSchedules[div]?.rounds||[];
    if(!rounds.length) return null;
    // リーグ戦はホーム＆アウェイ総当たりの全38節を、
    // カップ戦と重ならないように年間カレンダー上の38週へ1節ずつ割り当てる。
    const idx=Math.max(0,Math.min(rounds.length-1,Number(slot)||0));
    return {idx,round:rounds[idx]};
  }
  const _oldSimDivisionMatchesFinal=simDivisionMatches;
  simDivisionMatches=function(division){
    ensureLeagueSchedule();
    const data=roundForSlot(division,ST.leagueMatchSlot||0);
    if(!data) return [];
    const key=`${division}:${data.idx}`;
    const sched=ST.leagueSchedules[division];
    if(sched.played.includes(data.idx)) return [];
    const results=[];
    data.round.forEach(({home,away})=>{
      // 試合直前に編成を変更した場合も、その時点のスタメン評価を結果へ引き継ぐ。
      const [hs,as,hScorer,aScorer,matchLog,matchRatings]=playMatch(home,away);
      results.push([home,hs,as,away,hScorer,aScorer,matchLog,matchRatings||[]]);
      const sh=ST.teamStats[home], sa=ST.teamStats[away];
      if(!sh||!sa) return;
      sh.gf+=hs; sh.ga+=as; sa.gf+=as; sa.ga+=hs;
      if(hs>as){ sh.pts+=3; sh.w++; sa.l++; }
      else if(as>hs){ sa.pts+=3; sa.w++; sh.l++; }
      else { sh.pts++; sh.d++; sa.pts++; sa.d++; }
    });
    const mine=results.find(r=>r[0]===ST.myTeam||r[3]===ST.myTeam);
    if(mine){
      const hs=mine[1], as=mine[2];
      const win=(mine[0]===ST.myTeam?hs>as:as>hs), draw=hs===as;
      // 既存の経済システムを維持しつつ、初期資金2,000Mに合わせて収益を抑制。
      if(win) ST.budget+=30;
      else if(draw) ST.budget+=10;
      else ST.budget+=5;
      const level=ST.stadiumLevel||1, fans=Math.max(10000,ST.fans||30000);
      const attendance=Math.min(ST.stadiumCapacity||20000,Math.round(fans*(0.55+level*0.04)));
      const ticket=Math.round(attendance*0.0012), goods=Math.round(attendance*0.00035), food=Math.round(attendance*0.00025);
      const isHome=mine[0]===ST.myTeam;
      const venueMultiplier=isHome?1:0.5;
      const revenue=Math.max(3,Math.round((ticket+goods+food+(level-1)*8)*0.45*venueMultiplier));
      ST.budget+=revenue;
      if(win) ST.fans=Math.min(500000,(ST.fans||0)+1200); else if(draw) ST.fans=Math.min(500000,(ST.fans||0)+400); else ST.fans=Math.max(5000,(ST.fans||0)-200);
      if(ST.teams[ST.myTeam].roster.some(p=>hasSkill(p,'influencer'))) ST.fans=Math.min(500000,ST.fans+PLAYER_SKILLS.influencer.fans);
      ST.expansionLastMatch={type:'league',opponent:mine[0]===ST.myTeam?mine[3]:mine[0],revenue,attendance};
      addNews(`💰 試合収益 ${formatMoney(revenue)}（${isHome?'ホーム':'アウェイ'}・チケット・グッズ・飲食）／観客${attendance.toLocaleString()}人`);
    }
    sched.played.push(data.idx);
    return results;
  };
  const _oldBuildFixtureScheduleFinal=buildFixtureSchedule;
  buildFixtureSchedule=function(){
    ensureLeagueSchedule();
    const fixtures=[];
    const div=ST.teams?.[ST.myTeam]?.division || ST.myDivision || 'J1';
    const month=Number(ST.month)||1;

    // 秋夏制：1=8月、2=9月、3=10月、4=11月、5=12月、6=1月、
    // 7=2月、8=3月、9=4月、10=5月、11=6月、12=7月。
    // カップ開催週を先に固定し、リーグ戦とは絶対に重ねない。
    const emperorDate=(m,w)=> (m===2&&w===1) || (m===2&&w===4) || (m===3&&w===1) || (m===4&&w===1) || (m===5&&w===1) || (m===6&&w===1);
    const levainDate=(m,w)=> (m===6&&w===3) || (m===7||m===8||m===9) && w===1 || (m===11&&w===1);
    const isCupDate=(m,w)=>emperorDate(m,w) || (div==='J1' && levainDate(m,w));

    // 1シーズン96週からカップ10週を除いた86週に、リーグ38節を均等配置。
    // 固定位置なのでセーブデータを読み直しても日程が変わらない。
    const available=[];
    for(let gm=1;gm<=11;gm++) for(let gw=1;gw<=8;gw++){
      if(!isCupDate(gm,gw)) available.push((gm-1)*8+(gw-1));
    }
    const leagueWeeks=new Set();
    const leagueRoundByGlobal=new Map();
    const roundsCount=ST.leagueSchedules?.[div]?.rounds?.length||0;
    const targetCount=Math.min(38,roundsCount);
    for(let r=0;r<targetCount;r++){
      const pos=Math.round(r*(available.length-1)/Math.max(1,targetCount-1));
      const g=available[pos];
      leagueWeeks.add(g);
      leagueRoundByGlobal.set(g,r);
    }

    // 新シーズン開始時はリーグ戦の消化履歴もリセット。
    if(month===1 && Number(ST.week)===1){
      const sig=ST.leagueSchedules?.[div]?.signature;
      if(sig) ST.leagueSchedules[div].played=[];
    }

    for(let w=1;w<=8;w++){
      const global=(month-1)*8+(w-1);
      if(isCupDate(month,w)){
        let cupKey=null;
        if(emperorDate(month,w) && ST.cups?.emperor && !ST.cups.emperor.champion && !ST.cups.emperor.myEliminated && Array.isArray(ST.cups.emperor.remaining) && ST.cups.emperor.remaining.includes(ST.myTeam)) cupKey='emperor';
        if(div==='J1' && levainDate(month,w) && ST.cups?.levain && !ST.cups.levain.champion && !ST.cups.levain.myEliminated && Array.isArray(ST.cups.levain.remaining) && ST.cups.levain.remaining.includes(ST.myTeam)) cupKey='levain';
        fixtures.push(cupKey
          ? {week:w,type:'cup',cupKey,competition:ST.cups[cupKey].name,opponent:'トーナメント'}
          : {week:w,type:'training',competition:'調整週（カップ戦開催日）',opponent:null});
        continue;
      }
      if(leagueWeeks.has(global)){
        const r=leagueRoundByGlobal.get(global);
        const data=roundForSlot(div,r);
        const mine=data?.round?.find(m=>m.home===ST.myTeam||m.away===ST.myTeam);
        fixtures.push({week:w,type:'league',competition:`${div}リーグ`,opponent:mine?(mine.home===ST.myTeam?mine.away:mine.home):'日程なし'});
      }else{
        fixtures.push({week:w,type:'training',competition:'調整週',opponent:null});
      }
    }

    ST.fixtureSchedule=fixtures;
    ST.fixtureScheduleVersion=7;
    // 現在週がリーグ戦なら、その節番号を試合処理側にも同期。
    const currentGlobal=(month-1)*8+(Number(ST.week)||1)-1;
    if(leagueRoundByGlobal.has(currentGlobal)) ST.leagueMatchSlot=leagueRoundByGlobal.get(currentGlobal);
    else{
      let count=0;
      for(const g of available){ if(g<currentGlobal && leagueRoundByGlobal.has(g)) count++; }
      ST.leagueMatchSlot=Math.min(targetCount,count);
    }
  };
  const _oldEnsureExpansionStateFinal=ensureExpansionState;
  ensureExpansionState=function(){
    _oldEnsureExpansionStateFinal();
    ensureLeagueSchedule();
    if(ST.budget!=null && ST.season===1 && !ST.myTeam) ST.budget=2000;
  };

  // ---------- AIの海外補強 ----------
  function aiOverseasRecruitment(){
    const teams=Object.keys(ST.teams||{}).filter(t=>t!==ST.myTeam);
    const log=[];
    teams.forEach(team=>{
      const club=ST.teams[team];
      if(!club || club.roster.length>=30 || foreignCount(team)>=5) return;
      // 月1回の更新ごとに約12%のクラブが海外選手を補強。上位クラブほど少し積極的。
      const chance=club.division==='J1'?0.18:0.12;
      if(Math.random()>chance) return;
      const pos=pick(['FW','MF','DF','GK']);
      const p=genPlayer(pos,{foreign:true,division:club.division,age:randInt(19,29),games:randInt(10,120),goals:pos==='FW'?randInt(0,25):pos==='MF'?randInt(0,12):0,assists:pos==='MF'?randInt(0,18):randInt(0,8),fromTeam:pick(OVERSEAS_CLUBS)});
      const fee=Math.max(80,Math.round(tradeValue(p)*(0.55+Math.random()*0.25)));
      if((club.aiBudget==null?2000:club.aiBudget)<fee) return;
      club.aiBudget=(club.aiBudget==null?2000:club.aiBudget)-fee;
      p.fromTeam=pick(OVERSEAS_CLUBS);
      club.roster.push(p);
      log.push(`${team}が海外から${p.name}（${p.pos}・平均${Math.round(total(p)/5)}）を$${fee}Mで獲得`);
      markImportant(team);
    });
    return log;
  }
  // ---------- AIクラブ育成：ユーザーだけが毎月成長する状態を防ぐ ----------
  function aiMonthlyDevelopment(){
    const teams=Object.keys(ST.teams||{}).filter(t=>t!==ST.myTeam);
    teams.forEach(team=>{
      const roster=ST.teams[team]?.roster||[];
      roster.forEach(p=>{
        if(Math.random()<0.28){
          const key=pick(['sho','pas','dri','def','phy']);
          const gain=Math.random()<0.12?2:1;
          p[key]=Math.min(99,(Number(p[key])||0)+gain);
        }
      });
      markImportant(team);
    });
  }

  const _oldSimAiTransfersFinal=simulateAiTransfers;
  simulateAiTransfers=function(){
    const log=_oldSimAiTransfersFinal();
    aiMonthlyDevelopment();
    const foreignLog=aiOverseasRecruitment();
    return [...log,...foreignLog];
  };

  // ---------- カップ戦トーナメント表・結果停止 ----------
  function cupRoundLabel(round){
    const n=Number(round)||1;
    // ラウンド番号ではなく「そのラウンド開始時の残りクラブ数」で表示。
    // 8→準々決勝、4→準決勝、2→決勝を保証する。
    const cup=ST?.__labelCupContext;
    const remaining=Number(cup?.remainingCount)||0;
    if(remaining===8) return '準々決勝';
    if(remaining===4) return '準決勝';
    if(remaining===2) return '決勝';
    return n===1?'1回戦':n===2?'2回戦':n===3?'3回戦':`${n}回戦`;
  }
  function ensureCupBracket(cup){
    if(!cup) return;
    if(!Array.isArray(cup.bracket)) cup.bracket=[];
    if(cup.myEliminatedRound==null) cup.myEliminatedRound=null;
    if(cup.myEliminatedLabel==null) cup.myEliminatedLabel=null;
    if(cup.runnerUp==null) cup.runnerUp=null;
    if(!cup.currentDraw || !Array.isArray(cup.currentDraw.pairs)) cup.currentDraw=null;
  }
  const _oldInitCupsFinal=initCups;
  initCups=function(){
    _oldInitCupsFinal();
    Object.values(ST.cups||{}).forEach(c=>ensureCupBracket(c));
  };
  const _oldSimCupFinal=simulateCupRound;
  function cupDivisionRank(team){
    const d=ST.teams?.[team]?.division;
    return d==='J1'?3:d==='J2'?2:1;
  }
  function cupStrength(team){
    const roster=ST.teams?.[team]?.roster||[];
    const avg=roster.length?roster.reduce((a,p)=>a+total(p),0)/roster.length:0;
    return cupDivisionRank(team)*1000+avg;
  }
  function makeRealisticCupDraw(teams,key){
    const arr=teams.slice().filter(t=>ST.teams?.[t]);
    // ルヴァン杯は1回戦だけシードを設定。20クラブなら12クラブがシード、8クラブが1回戦を戦い、2回戦は16クラブで全組み合わせ。
    if(key==='levain' && arr.length===20 && (ST.cups?.levain?.round||1)===1){
      const sorted=arr.slice().sort((a,b)=>cupStrength(b)-cupStrength(a));
      const seeded=sorted.slice(0,12);
      const first=shuffle(sorted.slice(12));
      const pairs=[];
      while(first.length>=2) pairs.push({home:first.pop(),away:first.pop()});
      return {pairs,bye:seeded};
    }
    // 2回戦以降のルヴァン杯はシードなし。
    const work=shuffle(arr);
    const pairs=[];
    let bye=null;
    // 天皇杯など奇数クラブのラウンドだけは公平性のため1クラブを次へ進める。
    if(work.length%2) bye=work.pop();
    while(work.length>=2){
      const home=work.pop();
      const away=work.pop();
      let h=home,a=away;
      if(key==='emperor' && cupDivisionRank(a)<cupDivisionRank(h)){ [h,a]=[a,h]; }
      pairs.push({home:h,away:a});
    }
    return {pairs,bye};
  }
  simulateCupRound=function(key){
    const cup=ST.cups?.[key];
    if(!cup || cup.champion || !Array.isArray(cup.remaining) || cup.remaining.length<=1) return;
    // カップ戦は日程に組まれた週だけ実施。調整週に勝手に試合を発生させない。
    if(ST.__scheduledCupKey!==key){ return; }
    ensureCupBracket(cup);
    ST.__labelCupContext={remainingCount:cup.remaining.length};
    const beforeHas=ST.myTeam && cup.remaining.includes(ST.myTeam);
    // 組み合わせは先に確定して保持。表示するたびに抽選が変わらないようにする。
    if(!cup.currentDraw || !Array.isArray(cup.currentDraw.pairs) || cup.currentDraw.round!==cup.round){
      const d=makeRealisticCupDraw(cup.remaining,key);
      cup.currentDraw={round:cup.round,pairs:d.pairs,bye:d.bye};
    }
    const draw=cup.currentDraw;
    const matches=[];
    const winners=[];
    draw.pairs.forEach(({home:h,away:a})=>{
      const [hs,as,hSc,aSc,matchLog,matchRatings]=playMatch(h,a);
      // カップ戦は90分同点でも引き分け扱いにせず、延長・PKで必ず勝者を決める。
      const wentToPenalties = hs===as;
      const winner=wentToPenalties ? (Math.random()<0.5?h:a) : (hs>as?h:a);
      const penaltyScore=wentToPenalties ? (winner===h ? 'PK 4-3' : 'PK 3-4') : null;
      winners.push(winner);
      matches.push({home:h,away:a,homeScore:hs,awayScore:as,winner,hScorers:hSc||[],aScorers:aSc||[],matchLog:matchLog||[],matchRatings:matchRatings||[],wentToPenalties,penaltyScore});
      if(h===ST.myTeam||a===ST.myTeam){
        const won=winner===ST.myTeam;
        if(!won){ cup.myEliminatedRound=cup.round; cup.myEliminatedLabel=cupRoundLabel(cup.round); }
        ST.matchResultModal={
          home:h, away:a, homeScore:hs, awayScore:as,
          isHome:h===ST.myTeam, oppName:h===ST.myTeam?a:h,
          myScore:h===ST.myTeam?hs:as, oppScore:h===ST.myTeam?as:hs,
          resultType:won?"win":"lose",
          hScorers:hSc||[], aScorers:aSc||[], matchLog:matchLog||[], matchRatings:matchRatings||[],
          wentToPenalties, penaltyScore,
          competition:cup.name, roundLabel:cupRoundLabel(cup.round)
        };
        addNews(`【${cup.name} ${cupRoundLabel(cup.round)}】${h} ${hs}-${as} ${a}　${won?'クラブは勝利し次のラウンドへ進出！':'クラブは敗退しました…'}`);
      }
    });
    if(draw.bye){
      // ルヴァン杯1回戦のシード組は「免除されてそのまま進出」ではなく、
      // 2回戦の参加クラブとして個別に残す。配列のまま1クラブ扱いにしない。
      const seededTeams=Array.isArray(draw.bye) ? draw.bye : [draw.bye];
      winners.push(...seededTeams);
      seededTeams.forEach(team=>{
        matches.push({home:team,away:null,homeScore:null,awayScore:null,winner:team,bye:true});
      });
    }
    cup.bracket.push({round:cup.round,label:cupRoundLabel(cup.round),matches});
    cup.currentDraw=null;
    cup.remaining=winners;
    cup.round++;
    if(cup.remaining.length===1){
      cup.champion=cup.remaining[0];
      const finalRound=cup.bracket[cup.bracket.length-1];
      const finalMatch=finalRound?.matches?.find(m=>m.away && (m.home===cup.champion||m.away===cup.champion));
      if(finalMatch) cup.runnerUp=finalMatch.home===cup.champion?finalMatch.away:finalMatch.home;
      addNews(`【${cup.name}】${cup.champion} が優勝しました！`);
      // カップ賞金はシーズン終了時に成績に応じて一括支給する。
    }
    if(beforeHas){
      // 決勝敗退は「決勝敗退」ではなく準優勝として扱う。
      const outcome=cup.champion===ST.myTeam?'優勝':cup.runnerUp===ST.myTeam?'準優勝':cup.myEliminatedRound!=null?`${cupRoundLabel(cup.myEliminatedRound)}敗退`:null;
      if(outcome) ST.resultQueue=ST.resultQueue||[], ST.resultQueue.push({type:'cup',key,outcome});
    }
    // 次週以降の表示を即時更新。
    buildFixtureSchedule();
  };
  function renderCupBracketModal(key){
    const cup=ST.cups?.[key];
    const ov=el(`<div class="modal-overlay"></div>`);
    const m=el(`<div class="modal" style="max-height:90vh;overflow:auto;"><div class="modal-title">🏆 ${esc(cup?.name||'カップ戦')} トーナメント</div></div>`);
    if(!cup){ m.appendChild(el(`<div class="empty-state">大会情報がありません。</div>`)); }
    else {
      const info=el(`<div class="card"><div class="section-title">${esc(cup.name)} 大会方式</div><div class="small">戦力・所属カテゴリを考慮して組み合わせを決定。下位カテゴリを優先してホーム側にするなど、実際のカップ戦に近い抽選です。</div></div>`);
      m.appendChild(info);
      if(Array.isArray(cup.remaining) && cup.remaining.length>1){
        if(!cup.currentDraw || cup.currentDraw.round!==cup.round){
          const d=makeRealisticCupDraw(cup.remaining,key);
          cup.currentDraw={round:cup.round,pairs:d.pairs,bye:d.bye};
        }
        const drawCard=el(`<div class="card"><div class="section-title">🎲 次回の組み合わせ</div></div>`);
        cup.currentDraw.pairs.forEach(mt=>drawCard.appendChild(el(`<div class="stat-row"><span>${esc(mt.home)} vs ${esc(mt.away)}</span><span class="small">${esc(ST.teams[mt.home]?.division||'')} × ${esc(ST.teams[mt.away]?.division||'')}</span></div>`)));
        if(cup.currentDraw.bye) drawCard.appendChild(el(`<div class="stat-row"><span>${esc(cup.currentDraw.bye)}</span><span class="num">シード／次ラウンド進出</span></div>`));
        m.appendChild(drawCard);
      }
    }
    cup.bracket?.forEach(r=>{
      const card=el(`<div class="card"><div class="section-title">${esc(r.label)}</div></div>`);
      r.matches.forEach(mt=>{
        if(mt.away==null) card.appendChild(el(`<div class="stat-row"><span>${esc(mt.home)}（シード）</span><span class="num">次ラウンド進出</span></div>`));

      });

      const names=cup.remaining.slice().sort((a,b)=>cupStrength(b)-cupStrength(a));

  }
  const _oldRenderHomeFinal=renderHome;
