    const clubCard=clubTitle?.closest('.card');

  // ---------- カップ・シーズン終了時にゲームを停止 ----------
  function cupResultText(item){
    const c=ST.cups?.[item.key];
    if(item.outcome==='優勝') return `${c.name} 優勝！`;
    if(item.outcome==='準優勝') return `${c.name} 準優勝！`;

  function renderCupResultModal(item){

    const m=el(`<div class="modal center"><div class="modal-title">🏆 ${esc(c?.name||'カップ戦')} 大会結果</div></div>`);

    const close=el(`<button class="btn btn-primary btn-block" style="margin-top:14px;">確認して進む</button>`);

  function renderSeasonResultModal(r){
    const ov=el(`<div class="modal-overlay"></div>`);
    const m=el(`<div class="modal center"><div class="modal-title">📅 シーズン${r.season} 終了</div></div>`);
    let status='';
    if(r.div==='J1' && r.rank===1) status='🏆 J1リーグ優勝';
    else if(r.promoted) status=`⬆️ ${r.div} ${r.rank}位・昇格`;
    else if(r.relegated) status=`⬇️ ${r.div} ${r.rank}位・降格`;
    else status=`${r.div} ${r.rank}位`;
    m.appendChild(el(`<div style="font-size:21px;font-weight:800;text-align:center;margin:16px 0;">${status}</div>`));
    m.appendChild(el(`<div class="stat-row"><span>リーグ成績</span><span class="num">${r.rank}位　${r.points}点</span></div>`));
    if(r.nextDiv!==r.div) m.appendChild(el(`<div class="stat-row"><span>来季所属</span><span class="num">${r.nextDiv}</span></div>`));
    if(r.startBudget!=null) m.appendChild(el(`<div class="stat-row"><span>シーズン開始予算</span><span class="num">$${r.startBudget}M</span></div>`));
    if(r.grossIncome!=null) m.appendChild(el(`<div class="stat-row"><span>シーズン中の収入目安</span><span class="num" style="color:var(--pitch);">+$${r.grossIncome}M</span></div>`));
    if(r.annualSalary!=null) m.appendChild(el(`<div class="stat-row"><span>年間年俸</span><span class="num" style="color:var(--red);">$${r.annualSalary}M</span></div>`));
    if(r.endBudget!=null) m.appendChild(el(`<div class="stat-row"><span>シーズン終了時予算</span><span class="num">$${r.endBudget}M</span></div>`));
    if(r.netBalance!=null) m.appendChild(el(`<div class="stat-row"><span>シーズン収支</span><span class="num" style="color:${r.netBalance>=0?'var(--pitch)':'var(--red)'};font-weight:800;">${r.netBalance>=0?'+':''}$${r.netBalance}M</span></div>`));
    if(Array.isArray(r.table) && r.table.length){
      const tc=el(`<div class="card" style="margin-top:12px;padding:10px;"><div class="section-title" style="font-size:12px;">📋 シーズン最終順位表</div></div>`);
      r.table.forEach(x=>{
        const mine=x.team===ST.myTeam;
        tc.appendChild(el(`<div class="stat-row" style="${mine?'background:rgba(34,168,91,.12);border-radius:6px;padding:6px 5px;':''}"><span><b>${x.rank}位</b> ${esc(x.team)}</span><span class="num">${x.pts}点　${x.w}勝${x.d}分${x.l}敗　${x.gf}-${x.ga}</span></div>`));
      });
      m.appendChild(tc);
    }
    const close=el(`<button class="btn btn-primary btn-block" style="margin-top:14px;">次のシーズンへ</button>`);
    close.onclick=()=>{ST.resultQueue.shift();render();}; m.appendChild(close); ov.appendChild(m); return ov;
  }
  const _oldRenderModalsFinal=renderModals;
  renderModals=function(app){
    if(ST.cupBracketModal){ app.appendChild(renderCupBracketModal(ST.cupBracketModal)); return; }
    // カップ戦の敗退・大会結果は、まず試合結果（スコア・得点者・評価）を確認してから表示する。
    if(ST.matchResultModal){ app.appendChild(renderMatchResultModal()); return; }
    if(ST.resultQueue?.length){
      const q=ST.resultQueue[0];
      if(q.type==='cup') app.appendChild(renderCupResultModal(q));
      else if(q.type==='season') app.appendChild(renderSeasonResultModal(q));
      return;
    }
    _oldRenderModalsFinal(app);
  };

  // カップ戦のシーズン終了賞金
  function getCupSeasonPrize(outcome){
    // 優勝 > 準優勝 > ベスト4 > ベスト8 > その他
    return ({'優勝':1000,'準優勝':500,'ベスト4':250,'ベスト8':125,'その他':50})[outcome]||0;
  }
  function getMyCupOutcome(cup){
    if(!cup || !ST.myTeam) return null;
    if(cup.champion===ST.myTeam) return '優勝';
    if(cup.runnerUp===ST.myTeam) return '準優勝';
    const r=Number(cup.myEliminatedRound);
    if(cup.myEliminatedLabel) return cup.myEliminatedLabel+'敗退';
    if(r===4) return 'ベスト4';
    if(r===3) return 'ベスト8';
    if(r>=1) return 'その他';
    return null;
  }
  const _oldResolveWeekFinal=resolveWeek;
  resolveWeek=function(matchResultsHolder){
    ensureLeagueSchedule();
    // 週を進める前の試合種別を必ず保存する。
    // _oldResolveWeekFinal() 内でST.weekが次週へ進むため、
    // 進行後にST.weekからfixtureを探すとリーグ戦のスロットが進まない不具合が起きる。
    const beforeSeason=ST.season, beforeMonth=ST.month, beforeWeek=ST.week;
    const beforeFixture=ST.fixtureSchedule?.find(x=>x.week===beforeWeek) || getCurrentFixture();
    // シーズン終了前にカップ戦の自クラブ成績を保存（旧処理でinitCupsされるため）。
    let cupSeasonPrizes=[];
    if(isSeasonEndMonth() && beforeWeek===8 && ST.myTeam){
      Object.entries(ST.cups||{}).forEach(([key,cup])=>{
        const outcome=getMyCupOutcome(cup);
        if(outcome){
          const prize=getCupSeasonPrize(outcome);
          cupSeasonPrizes.push({key,name:cup.name||key,outcome,prize});
        }
      });
    }
    let seasonInfo=null;
    if(isSeasonEndMonth() && beforeWeek===8 && ST.myTeam){
      const div=ST.teams[ST.myTeam]?.division||ST.myDivision;
      const rankList=sortedDivision(div);
      seasonInfo={season:beforeSeason,div,rank:rankList.indexOf(ST.myTeam)+1,points:ST.teamStats[ST.myTeam]?.pts||0,
        startBudget:Number(ST.seasonStartBudget)||0,annualSalary:annualSalaryTotal(ST.myTeam),
        table:rankList.map((team,i)=>({rank:i+1,team,pts:ST.teamStats[team]?.pts||0,w:ST.teamStats[team]?.w||0,d:ST.teamStats[team]?.d||0,l:ST.teamStats[team]?.l||0,gf:ST.teamStats[team]?.gf||0,ga:ST.teamStats[team]?.ga||0}))};
    }
    _oldResolveWeekFinal(matchResultsHolder);

    // 自クラブが敗退していても、カップ戦そのものは決勝まで継続する。
    // カップ開催日はリーグ戦を入れず、他クラブ同士の試合だけを自動消化する。
    const actualMonthBefore=SEASON_MONTHS[Math.max(1,Math.min(12,Number(beforeMonth)||1))-1];
    const cupDates=[];
    // 自クラブが敗退済みでも大会全体はこの固定日程で継続する。
    // 判定は「進行前の月・週」で行い、月末のST.month更新に影響されないようにする。
    if([9,10,11,12,1,2].includes(actualMonthBefore) && beforeWeek===1) cupDates.push('emperor');
    if(((actualMonthBefore===1 && beforeWeek===3) || [2,3,4,6].includes(actualMonthBefore) && beforeWeek===1)) cupDates.push('levain');
    cupDates.forEach(key=>{
      const cup=ST.cups?.[key];
      if(!cup || cup.champion) return;
      // _oldResolveWeekFinalで自クラブ参加中のカップ戦を処理済みなら二重開催しない。
      const roundBefore=Number(cup.round)||1;
      if(Number(cup.round)===roundBefore && beforeFixture?.type==='cup' && beforeFixture.cupKey===key) return;
      ST.__scheduledCupKey=key;
      simulateCupRound(key);
      ST.__scheduledCupKey=null;
    });
    // カップ戦賞金はシーズン終了処理後に支給。2大会それぞれの成績に応じて加算する。
    if(cupSeasonPrizes.length){
      cupSeasonPrizes.forEach(x=>{
        if(x.prize>0){
          ST.budget=Math.max(0,(Number(ST.budget)||0)+x.prize);
          addNews(`🏆 ${x.name} ${x.outcome}賞金 ${x.prize}Mを獲得しました。`);
        }
      });
    }
    // リーグ日程スロットは「進行前の週」がリーグ戦だった場合だけ1つ進める。
    if(beforeFixture?.type==='league'){
      ST.leagueMatchSlot=(ST.leagueMatchSlot||0)+1;
      ensureLeagueSchedule();
      buildFixtureSchedule();
    }
    if(beforeMonth===11 && beforeWeek===8 && seasonInfo){
      seasonInfo.endBudget=Number(ST.budget)||0;
      seasonInfo.netBalance=Math.round(seasonInfo.endBudget-seasonInfo.startBudget);
      seasonInfo.grossIncome=Math.max(0,Math.round(seasonInfo.netBalance+seasonInfo.annualSalary));
      seasonInfo.nextDiv=ST.teams[ST.myTeam]?.division||ST.myDivision;
      seasonInfo.promoted=seasonInfo.nextDiv!==seasonInfo.div && ((seasonInfo.div==='J2'&&seasonInfo.nextDiv==='J1')||(seasonInfo.div==='J3'&&seasonInfo.nextDiv==='J2'));
      seasonInfo.relegated=seasonInfo.nextDiv!==seasonInfo.div && ((seasonInfo.div==='J1'&&seasonInfo.nextDiv==='J2')||(seasonInfo.div==='J2'&&seasonInfo.nextDiv==='J3'));
      ST.resultQueue=ST.resultQueue||[];
      // シーズン表彰ニュースのシーズン番号はcomputeSeasonAwards側で修正済み。
      ST.resultQueue.push({type:'season',...seasonInfo});
      buildFixtureSchedule();
    }
    if(window.__J1_AUTO_SAVE) window.__J1_AUTO_SAVE();
  };

  // ---------- 初期化・旧セーブ互換 ----------
  const _oldNewGameStateFinal=newGameState;
  // newGameStateは既に定義済みオブジェクトを返すため、初期化後に確実に初期値を補正。
  const _oldBootGameFinal=bootGame;
  bootGame=function(){
    _oldBootGameFinal();
    if(ST && !ST.myTeam){ ST.budget=2000; ST.seasonStartBudget=2000; }
  };
  const _oldNormalizeLoadedFinal=normalizeLoadedState;
  normalizeLoadedState=function(){
    _oldNormalizeLoadedFinal();
    ensureLeagueSchedule();
    ST.resultQueue=Array.isArray(ST.resultQueue)?ST.resultQueue:[];
    // トーナメント表示中の状態はrender()のたびに消さない。
    // 旧セーブ等で不正なキーだけを無効化する。
    if(ST.cupBracketModal && !ST.cups?.[ST.cupBracketModal]) ST.cupBracketModal=null;
    Object.values(ST.cups||{}).forEach(ensureCupBracket);
    // 旧セーブのGK/DFの「過去ランダム得点」は歴代表示ではポジションフィルタで除外。
    if(ST.leagueMatchSlot==null) ST.leagueMatchSlot=0;
  };
  ensureLeagueSchedule();

  // ---------- ターン進行の安全化 ----------
  // 古いセーブで日程がずれていても、調整週・試合週を正しく1ターン進められるようにする。
  // ---------- ターン進行の最終安定版 ----------
  // 旧ラッパーを何重にも呼ばず、「現在週」を固定して1回だけ処理する。
  advanceWeek=function(){
    if(!ST || !ST.myTeam) return;
    try{
      // 結果・年俸精算・スポンサー契約の確認中は二重進行を防止。
      if(Array.isArray(ST.resultQueue) && ST.resultQueue.length){
        ST.toast='先に表示中の結果を確認してください。';
        render();
        return;
      }
      if(ST.salarySettlement){
        ST.toast='先に年間年俸の精算を完了してください。';
        render();
        return;
      }
      if(ST.showSponsorModal){
        ST.toast='スポンサー画面を閉じてからターンを進めてください。';
        render();
        return;
      }

      ensureExpansionState();
      ensureLeagueSchedule();
      buildFixtureSchedule();

      // getCurrentFixture() は旧パッチ内のローカル関数なので、ここでは直接取得する。
      const week=Number(ST.week)||1;
      const f=(Array.isArray(ST.fixtureSchedule)?ST.fixtureSchedule:[]).find(x=>Number(x.week)===week) || {week,type:'training',competition:'調整週'};

      if(f.type==='league' || f.type==='cup'){
        ST.screen='prematch';
        ST.toast=`${f.competition}：試合前です。編成を確認してください。`;
        render();
        return;
      }

      // 調整週は即時処理。resolveWeek側で週を1つだけ進める。
      resolveWeek(null);
    }catch(e){
      console.error('advanceWeek failed:',e);
      // 例外でゲームが完全停止しないよう、最低限の週送りを行う。
      const oldWeek=Number(ST.week)||1;
      ST.week=oldWeek+1;
      if(ST.week>8){
        ST.week=1;
        ST.month=(Number(ST.month)||1)+1;
        if(ST.month>12){ ST.month=1; ST.season=(Number(ST.season)||1)+1; }
      }
      ST.screen='home';
      ST.toast='ターンを進めました（内部処理の一部でエラーが発生しました）。';
      try{ buildFixtureSchedule(); }catch(_){}
      try{ render(); }catch(_){}
    }
  };
  window.advanceWeek=advanceWeek;
})();


/* ========================= REALISTIC ACHIEVEMENT STATS PATCH =========================
   実績・歴代記録をサッカーのポジションごとの役割に合わせて表示する。
*/
(function(){
  function ensureRealisticRecordFields(){
    if(!ST || !ST.teams) return;
    Object.values(ST.teams).forEach(t=>(t.roster||[]).forEach(p=>{
      if(!p) return;
      p.cleanSheets=Number(p.cleanSheets)||0;
      p._baseCleanSheets=Number.isFinite(Number(p._baseCleanSheets))?Number(p._baseCleanSheets):p.cleanSheets;
      p._seasonCleanSheets=Number.isFinite(Number(p._seasonCleanSheets))?Number(p._seasonCleanSheets):p.cleanSheets;
    }));
  }

  const _oldPlayMatchRealistic=playMatch;
  playMatch=function(home,away){
    ensureRealisticRecordFields();
    const participants={};
    [home,away].forEach(teamName=>{
      const roster=ST.teams[teamName]?.roster||[];
      const starters=teamName===ST.myTeam
        ? Object.values(ST.starters||{}).filter(Boolean)
        : roster.filter(p=>!p.injured).slice(0,11);
      participants[teamName]=starters.map(p=>({id:p.id,pos:p.pos}));
    });
    const result=_oldPlayMatchRealistic(home,away);
    const hs=Number(result?.[0])||0, as=Number(result?.[1])||0;
    // 無失点はGK・DFの重要な実績として記録。
    if(as===0){
      (participants[home]||[]).filter(x=>x.pos==='GK'||x.pos==='DF').forEach(x=>{
        const p=(ST.teams[home]?.roster||[]).find(v=>v.id===x.id); if(p) p.cleanSheets=(p.cleanSheets||0)+1;
      });
    }
    if(hs===0){
      (participants[away]||[]).filter(x=>x.pos==='GK'||x.pos==='DF').forEach(x=>{
        const p=(ST.teams[away]?.roster||[]).find(v=>v.id===x.id); if(p) p.cleanSheets=(p.cleanSheets||0)+1;
      });
    }
    return result;
  };

  // 既存セーブでも新しい記録項目を使えるようにする。
  const _oldEnsureAchievementsRealistic=ensureAchievements;
  ensureAchievements=function(){
    _oldEnsureAchievementsRealistic();
    ensureRealisticRecordFields();
    Object.values(ST.teams||{}).forEach(team=>(team.roster||[]).forEach(p=>{
      const r=ST.achievements.records[p.id];
      if(r){
        r.cleanSheets=Number(r.cleanSheets)||0;
        r.pos=p.pos;
        r.name=p.name;
        r.team=Object.keys(ST.teams).find(k=>ST.teams[k]===team)||r.team||ST.myTeam;
      }
    }));
  };

  // シーズン集計にも無失点数を保存。
  const _oldSnapshotSeasonHistoryRealistic=snapshotSeasonHistory;
  snapshotSeasonHistory=function(){
    ensureRealisticRecordFields();
    const base={};
    Object.values(ST.teams||{}).forEach(t=>(t.roster||[]).forEach(p=>{ base[p.id]=Number(p._baseCleanSheets)||0; }));
    const seasonPlayers=_oldSnapshotSeasonHistoryRealistic();
    const deltaById={};
    Object.values(ST.teams||{}).forEach(t=>(t.roster||[]).forEach(p=>{
      const delta=Math.max(0,(p.cleanSheets||0)-(base[p.id]||0));
      deltaById[p.id]=delta;
      const h=p.history?.[p.history.length-1];
      if(h && h.season===ST.season) h.cleanSheets=delta;
      p._baseCleanSheets=p.cleanSheets||0;
    }));
    return seasonPlayers.map(sp=>({...sp,cleanSheets:deltaById[sp.p.id]||0}));
  };

  // ポジション別に役割へ沿った評価で年間ベスト11を選出。
  const _oldComputeSeasonAwardsRealistic=computeSeasonAwards;
  computeSeasonAwards=function(seasonPlayers,awardSeason=ST.season){
    if(!Array.isArray(seasonPlayers)||!seasonPlayers.length) return _oldComputeSeasonAwardsRealistic(seasonPlayers,awardSeason);
    const slots={GK:1,DF:4,MF:3,FW:3};
    const byPos={GK:[],DF:[],MF:[],FW:[]};
    seasonPlayers.forEach(sp=>{
      const pos=sp.p?.pos;
      if(!byPos[pos] || !(sp.games>0)) return;
      let score=sp.games;
      if(pos==='GK') score += (sp.cleanSheets||0)*4;
      if(pos==='DF') score += (sp.cleanSheets||0)*2 + (sp.goals||0)*3 + (sp.assists||0)*1.5;
      if(pos==='MF') score += (sp.goals||0)*3 + (sp.assists||0)*3;
      if(pos==='FW') score += (sp.goals||0)*4 + (sp.assists||0)*2;
      byPos[pos].push({...sp,score});
    });
    const bestXI=[];
    Object.keys(slots).forEach(pos=>{
      byPos[pos].sort((a,b)=>b.score-a.score||b.games-a.games);
      bestXI.push(...byPos[pos].slice(0,slots[pos]));
    });
    let topScorer=seasonPlayers.filter(x=>(x.p.pos==='FW'||x.p.pos==='MF')&&x.goals>0).sort((a,b)=>b.goals-a.goals||b.assists-a.assists)[0]||null;
    ensureAchievements();
    const existing=ST.achievements.individual||[];
    // 旧セーブで同一シーズンの重複登録を避ける。
    ST.achievements.individual=existing.filter(a=>!(a.season===awardSeason&&(a.type==='得点王'||a.type==='アシスト王'||a.type==='ベストイレブン')));
    bestXI.forEach(sp=>{
      sp.p.fameMult=Math.min(2.5,(sp.p.fameMult||1)+0.12);
      const r=ST.achievements.records[sp.p.id];
      if(r) r.awards=(r.awards||0)+1;
      ST.achievements.individual.push({season:awardSeason,type:'ベストイレブン',name:sp.p.name,team:sp.team,pos:sp.p.pos,value:sp.goals||0,cleanSheets:sp.cleanSheets||0,assists:sp.assists||0,games:sp.games||0});
    });
    if(topScorer){
      topScorer.p.fameMult=Math.min(2.5,(topScorer.p.fameMult||1)+0.15);
      const r=ST.achievements.records[topScorer.p.id]; if(r) r.awards=(r.awards||0)+1;
      ST.achievements.individual.push({season:awardSeason,type:'得点王',name:topScorer.p.name,team:topScorer.team,pos:topScorer.p.pos,value:topScorer.goals});
    }
    const topAssist=seasonPlayers.filter(x=>(x.p.pos==='FW'||x.p.pos==='MF')&&x.assists>0).sort((a,b)=>b.assists-a.assists||b.goals-a.goals)[0]||null;
    if(topAssist){
      topAssist.p.fameMult=Math.min(2.5,(topAssist.p.fameMult||1)+0.15);
      const r=ST.achievements.records[topAssist.p.id]; if(r) r.awards=(r.awards||0)+1;
      ST.achievements.individual.push({season:awardSeason,type:'アシスト王',name:topAssist.p.name,team:topAssist.team,pos:topAssist.p.pos,value:topAssist.assists});
    }
    if(ST.achievements.individual.length>100) ST.achievements.individual.splice(0,ST.achievements.individual.length-100);
    const log=[`🏆 シーズン${awardSeason}のベストイレブンが発表されました：${bestXI.map(x=>`${x.p.name}(${x.p.pos}/${x.team})`).join('、')}`];
    if(topScorer) log.push(`⚽ シーズン${awardSeason}の得点王は ${topScorer.p.name}（${topScorer.team}）！ ${topScorer.goals}得点を記録しました。`);
    if(topAssist) log.push(`🅰️ シーズン${awardSeason}のアシスト王は ${topAssist.p.name}（${topAssist.team}）！ ${topAssist.assists}アシストを記録しました。`);
    return log;
  };

  const _oldRecordSeasonAchievementsRealistic=recordSeasonAchievements;
  recordSeasonAchievements=function(){
    ensureRealisticRecordFields();
    const result=_oldRecordSeasonAchievementsRealistic();
    Object.values(ST.teams||{}).forEach(team=>(team.roster||[]).forEach(p=>{
      const r=ST.achievements.records[p.id];
      if(r){ r.cleanSheets=Math.max(Number(r.cleanSheets)||0,Number(p.cleanSheets)||0); r.games=Math.max(Number(r.games)||0,Number(p.games)||0); r.goals=Math.max(Number(r.goals)||0,Number(p.goals)||0); r.assists=Math.max(Number(r.assists)||0,Number(p.assists)||0); }
    }));
    return result;
  };

  // 実績画面を、GK=無失点、DF=無失点、MF=アシスト、FW=得点という自然な形に変更。
  const _oldRenderAchievementsRealistic=renderAchievements;
  renderAchievements=function(){
    ensureAchievements();
    const wrap=_oldRenderAchievementsRealistic();
    const records=Object.values(ST.achievements.records||{});
    const myIds=new Set((ST.teams[ST.myTeam]?.roster||[]).map(p=>p.id));
    const mine=records.filter(r=>myIds.has(r.id)||r.team===ST.myTeam);
    const best=(arr,filter,key)=>arr.filter(filter).sort((a,b)=>(Number(b[key])||0)-(Number(a[key])||0)||((Number(b.games)||0)-(Number(a.games)||0)))[0];
    const gk=best(mine,r=>r.pos==='GK','cleanSheets');
    const df=best(mine,r=>r.pos==='DF','cleanSheets');
    const mf=best(mine,r=>r.pos==='MF','assists');
    const fw=best(mine,r=>r.pos==='FW','goals');
    const card=el(`<div class="card"><div class="section-title">📌 ポジション別・歴代主要記録</div><div class="small" style="margin-bottom:8px;">実際のサッカーで重視される役割に合わせて集計しています。</div></div>`);
    [
      ['🧤 GK','最多無失点',gk,gk?`${gk.cleanSheets||0}試合`:'—'],
      ['🛡️ DF','最多無失点',df,df?`${df.cleanSheets||0}試合`:'—'],
      ['🎯 MF','最多アシスト',mf,mf?`${mf.assists||0}アシスト`:'—'],
      ['⚡ FW','最多得点',fw,fw?`${fw.goals||0}得点`:'—']
    ].forEach(([pos,label,r,val])=>card.appendChild(el(`<div class="stat-row"><span>${pos} ${label}<br><span class="small">${r?esc(r.name):'記録なし'}</span></span><span class="num">${val}</span></div>`)));
    wrap.appendChild(card);

    // 個人記録タブの一覧もポジション別に自然な成績を表示する。
    if(ST.achievementTab==='records'){
      const oldCards=wrap.querySelectorAll('.card');
      const target=[...oldCards].find(c=>c.textContent.includes('自クラブ歴代個人記録'));
      if(target){
        const list=[...mine].sort((a,b)=>{
          const value=r=>r.pos==='GK'?r.cleanSheets||0:r.pos==='DF'?r.cleanSheets||0:r.pos==='MF'?r.assists||0:r.goals||0;
          return value(b)-value(a)||(b.games||0)-(a.games||0);
        });
        const newCard=el('<div class="card"><div class="section-title">📈 自クラブ歴代個人記録</div><div class="small" style="margin-bottom:8px;">GK・DFは無失点、MFはアシスト、FWは得点を主要指標として表示。</div></div>');
        if(!list.length) newCard.appendChild(el('<div class="empty-state">まだ個人記録がありません。</div>'));
        list.slice(0,30).forEach((r,i)=>{
          const main=r.pos==='GK'?`${r.cleanSheets||0}無失点`:r.pos==='DF'?`${r.cleanSheets||0}無失点`:r.pos==='MF'?`${r.assists||0}A`:r.pos==='FW'?`${r.goals||0}G`:'—';
          const secondary=r.pos==='GK'||r.pos==='DF'?`${r.games||0}試合 ・ ${r.goals||0}得点 ・ ${r.assists||0}アシスト`:r.pos==='MF'?`${r.games||0}試合 ・ ${r.goals||0}得点 ・ ${r.assists||0}アシスト`:`${r.games||0}試合 ・ ${r.goals||0}得点 ・ ${r.assists||0}アシスト`;
          newCard.appendChild(el(`<div class="list-item"><div><div class="pname">${i+1}. ${esc(r.name)} <span class="small">${esc(r.pos||'')}</span></div><div class="pmeta">${secondary}${r.awards?' ・ 🏅表彰'+r.awards+'回':''}</div></div><span class="pill rankS">${main}</span></div>`));
        });
        target.replaceWith(newCard);
      }
    }
    return wrap;
  };

  // 初期化・ロード時にもフィールドを付与。
  try{ ensureRealisticRecordFields(); }catch(e){}
})();

/* ========================= INIT ========================= */
// 起動時は必ずタイトル画面から開始する。
// DOM生成前の実行や一部環境での初期化競合を避けるため、DOMContentLoaded後に初期化する。
function bootGame(){
  try{
    ST=newGameState();
    let pending=null;
    try{ pending=sessionStorage.getItem("SM_PENDING_BOOT"); if(pending) sessionStorage.removeItem("SM_PENDING_BOOT"); }catch(_){}
    ensureManagerState();
    ST.screen=(pending==="start")?"teamSelect":"title";
    render();
    if(pending==="load") openSaveSlotModal("load");
  }catch(err){
    console.error("Game boot error:",err);
    showBootError(err);
  }
}
// Static title buttons use the early boot handlers above.
;
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded",bootGame,{once:true});
else bootGame();
</script>

<script>
/* ================= FINAL USER REQUEST PATCH ================= */
(function(){
  if(typeof playMatch!=='function') return;
  const _playMatchUserPatch=playMatch;
  function appearedPlayers(teamName, log){
    const roster=ST.teams?.[teamName]?.roster||[];
    const starters=teamName===ST.myTeam
      ? Object.values(ST.starters||{}).filter(Boolean)
      : roster.filter(p=>!p.injured).slice(0,11);
    const ids=new Set(starters.map(p=>p.id));
    const subs=[];
    (log||[]).forEach(e=>{
      const text=String(e.text||'');
      const m=text.match(/^🔄\s+(.+?)\s+IN ／ (.+?)\s+OUT$/);
      if(m){ const name=m[1].trim(); const p=roster.find(x=>x.name===name); if(p){ids.add(p.id);subs.push(p);} }
    });
    return {ids,starters,subs};
  }
  function sanitizeMatchStats(teamName, before, score, log){
    const roster=ST.teams?.[teamName]?.roster||[];
    const ap=appearedPlayers(teamName,log);
    const valid=ap.ids;
    let validPlayers=roster.filter(p=>valid.has(p.id));
    if(!validPlayers.length) validPlayers=ap.starters;
    // 出場していない選手に付いた得点・アシストを取り消す。
    let removedGoals=0, removedAssists=0;
    roster.forEach(p=>{
      const b=before[p.id]||{goals:p.goals||0,assists:p.assists||0};
      const dg=(p.goals||0)-b.goals, da=(p.assists||0)-b.assists;
      if(!valid.has(p.id)){
        if(dg>0){p.goals=b.goals;removedGoals+=dg;}
        if(da>0){p.assists=b.assists;removedAssists+=da;}
      }
    });
    // スコアと実際の得点者数がずれた場合、実際の出場者へ振り替える。
    let currentAdded=validPlayers.reduce((s,p)=>s+Math.max(0,(p.goals||0)-(before[p.id]?.goals||0)),0);
    let missing=Math.max(0,(Number(score)||0)-currentAdded);
    while(missing>0 && validPlayers.length){
      const fw=validPlayers.filter(p=>p.pos==='FW'||p.pos==='MF');
      const pool=fw.length?fw:validPlayers;
      const target=pool[Math.floor(Math.random()*pool.length)];
      target.goals=(target.goals||0)+1; missing--;
    }
    // 余計なアシストもチーム得点数を超えないように制限し、出場者だけに残す。
    const teamGoalAdds=validPlayers.reduce((s,p)=>s+Math.max(0,(p.goals||0)-(before[p.id]?.goals||0)),0);
    let assistAdds=validPlayers.reduce((s,p)=>s+Math.max(0,(p.assists||0)-(before[p.id]?.assists||0)),0);
    const maxAssists=teamGoalAdds;
    if(assistAdds>maxAssists){
      let over=assistAdds-maxAssists;
      for(const p of validPlayers){
        const b=before[p.id]?.assists||0;
        const d=Math.max(0,(p.assists||0)-b);
        const cut=Math.min(d,over); p.assists-=cut; over-=cut;
        if(!over) break;
      }
    }
    // ログの得点者も「実際の出場者」に統一する。
    const goalEvents=(log||[]).filter(e=>String(e.text||'').includes('⚽'));
    const usedNames=validPlayers.map(p=>p.name);
    let gi=0;
    goalEvents.forEach(e=>{
      const text=String(e.text||'');
      const mm=text.match(/^(⚽\s*\d+分\s+)(.+?)(\s+がゴール！)$/);
      if(!mm) return;
      const name=mm[2];
      if(!usedNames.includes(name)){
        const fw=validPlayers.filter(p=>p.pos==='FW'||p.pos==='MF');
        const pool=fw.length?fw:validPlayers;
        if(pool.length){
          e.text=mm[1]+pool[gi%pool.length].name+mm[3]; gi++; }
      }
    });
  }
  playMatch=function(home,away){
    const before={};
    [home,away].forEach(t=>(ST.teams?.[t]?.roster||[]).forEach(p=>before[p.id]={goals:p.goals||0,assists:p.assists||0}));
    const result=_playMatchUserPatch(home,away);
    const log=Array.isArray(result?.[4])?result[4]:[];
    sanitizeMatchStats(home,before,result?.[0],log);
    sanitizeMatchStats(away,before,result?.[1],log);
    // 途中交代で実際に出場した選手にも評価を付与。
    let ratings=Array.isArray(result?.[5])?[...result[5]]:[];
    [home,away].forEach(teamName=>{
      if(teamName!==ST.myTeam) return;
      const ap=appearedPlayers(teamName,log);
      const existing=new Set(ratings.map(x=>x.id));
      const myScore=home===ST.myTeam?Number(result?.[0])||0:Number(result?.[1])||0;
      const oppScore=home===ST.myTeam?Number(result?.[1])||0:Number(result?.[0])||0;
      const resultBonus=myScore>oppScore?0.25:myScore<oppScore?-0.20:0;
      ap.subs.forEach(p=>{
        if(existing.has(p.id)) return;
        const abilityAvg=p.pos==='GK'?((p.gk||0)+total(p))/6:total(p)/5;
        let rating=5.55+abilityAvg/100+((CONDITION_MODS[p.condition]||1)-1)*2.0+resultBonus+(Math.random()-0.5)*0.25;
        const b=before[p.id]||{goals:p.goals||0,assists:p.assists||0};
        const goals=Math.max(0,(p.goals||0)-b.goals), assists=Math.max(0,(p.assists||0)-b.assists);
        rating+=goals*1.05+assists*0.55;
        rating=Math.max(5.0,Math.min(10.0,Math.round(rating*10)/10));
        ratings.push({id:p.id,name:p.name,pos:p.pos,rating,goals,assists,substitute:true});
      });
    });
    result[5]=ratings;
    return result;
  };

  // 自クラブ歴代個人記録 → 自クラブ歴代個人シーズン記録
  if(typeof renderAchievements==='function'){
    const _renderAchievementsUser=renderAchievements;
    renderAchievements=function(){
      const wrap=_renderAchievementsUser();
      const titles=[...wrap.querySelectorAll('.section-title')];
      const old=titles.find(x=>x.textContent.includes('自クラブ歴代個人記録'));
      if(old){
        const card=old.closest('.card');
        const newCard=el(`<div class="card"><div class="section-title">📊 自クラブ歴代個人シーズン記録</div><div class="small" style="margin-bottom:8px;">自チーム所属時の各シーズン成績を、得点・アシスト・平均評価でランキング表示します。</div></div>`);
        const rows=[];
        (ST.achievements?.records?Object.values(ST.achievements.records):[]).forEach(r=>{
          const hist=r.history||[];
          hist.forEach(h=>{ if(h && (h.team===ST.myTeam || h.club===ST.myTeam)) rows.push({name:r.name,pos:r.pos,season:h.season,games:h.games||0,goals:h.goals||0,assists:h.assists||0,rating:h.rating||h.avgRating||0}); });
        });
        // 旧セーブの履歴は player.history を優先して再構成。
        (ST.teams?.[ST.myTeam]?.roster||[]).forEach(p=>(p.history||[]).forEach(h=>{
          if(h.team===ST.myTeam) rows.push({name:p.name,pos:p.pos,season:h.season,games:h.games||0,goals:h.goals||0,assists:h.assists||0,rating:h.rating||h.avgRating||0});
        }));
        const dedup=new Map(); rows.forEach(r=>dedup.set(`${r.name}|${r.season}|${r.pos}`,r));
        const list=[...dedup.values()];
        const sections=[
          ['⚽ 得点ランキング', [...list].sort((a,b)=>b.goals-a.goals||b.games-a.games).slice(0,10), r=>`${r.goals}得点`],
          ['🅰️ アシストランキング', [...list].sort((a,b)=>b.assists-a.assists||b.games-a.games).slice(0,10), r=>`${r.assists}アシスト`],
          ['⭐ 評価ランキング', [...list].filter(r=>Number(r.rating)>0).sort((a,b)=>b.rating-a.rating||b.games-a.games).slice(0,10), r=>Number(r.rating).toFixed(2)],
        ];
        sections.forEach(([label,arr,main])=>{
          newCard.appendChild(el(`<div class="section-title" style="font-size:12px;margin-top:10px;">${label}</div>`));
          if(!arr.length){newCard.appendChild(el(`<div class="empty-state">まだシーズン記録がありません。</div>`));return;}
          arr.forEach((r,i)=>newCard.appendChild(el(`<div class="list-item"><div><div class="pname">${i+1}. ${esc(r.name)} <span class="small">${esc(r.pos||'')}・S${r.season}</span></div><div class="pmeta">${r.games}試合 ・ ${r.goals}得点 ・ ${r.assists}アシスト${r.rating?` ・ 平均評価 ${Number(r.rating).toFixed(2)}`:''}</div></div><span class="pill rankS">${main(r)}</span></div>`)));
        });
        card.replaceWith(newCard);
      }
      // ポジション別歴代記録カードは完全に削除。
      [...wrap.querySelectorAll('.section-title')].forEach(x=>{if(x.textContent.includes('ポジション別')&&x.textContent.includes('歴代')) x.closest('.card')?.remove();});
      return wrap;
    };
  }

  // ルヴァンカップ：1回戦のみシード可。2回戦以降は必ず全クラブが対戦。
  if(typeof makeRealisticCupDraw==='function'){
    const _draw=makeRealisticCupDraw;
    makeRealisticCupDraw=function(teams,key){
      if(key!=='levain') return _draw(teams,key);
      let arr=teams.slice().filter(t=>ST.teams?.[t]);
      // 20クラブなら1回戦は12クラブをシード、8クラブだけが1回戦を戦い、2回戦で16クラブにする。
      if(arr.length===20 && (ST.cups?.levain?.round||1)===1){
        const sorted=arr.slice().sort((a,b)=>cupStrength(b)-cupStrength(a));
        const seeded=sorted.slice(0,12), first=shuffle(sorted.slice(12));
        const pairs=[];
        while(first.length){pairs.push({home:first.pop(),away:first.pop()});}
        return {pairs,bye:seeded};
      }
      // 2回戦以降は偶数になるため、bye/シードを発生させない。
      arr=shuffle(arr);
      const pairs=[]; while(arr.length>=2) pairs.push({home:arr.pop(),away:arr.pop()});
      return {pairs,bye:null};
    };
  }
})();
</script>


<script>
/* ================= SEASON PLAYER RATING HISTORY PATCH ================= */
(function(){
  const _register=registerMonthlyMatchRatings;
  registerMonthlyMatchRatings=function(ratings){
    _register(ratings);
    ST.seasonPlayerRatings=ST.seasonPlayerRatings||{};
    (ratings||[]).forEach(x=>{

        h.ratingMatches=r?.matches||0;
      }
    });
    ST.seasonPlayerRatings={};
    return result;
  };
  const _newNormalize=normalizeLoadedState;
  normalizeLoadedState=function(){

})();

<script>
/* ================= PRE-GAME CAREER HISTORY / CLUB TRANSFERS ================= */
(function(){
  function seedPreGameCareerHistory(){
    if(!window.ST || !ST.teams) return;
    const allTeams=Object.keys(ST.teams);
    if(!allTeams.length) return;
    Object.keys(ST.teams).forEach(currentTeam=>{
      const roster=ST.teams[currentTeam]?.roster||[];
      roster.forEach(p=>{
        if(!Array.isArray(p.history)) p.history=[];
        if(p.history.some(h=>h && h.preGame)) return;

        const age=Math.max(16,Number(p.age)||18);
        // ゲーム開始前のプロキャリア。若手ほど過去シーズンを少なくする。
        const seasonCount=Math.max(0,Math.min(6,age-18));
        if(seasonCount<=0) return;

        let totalGames=Math.max(0,Number(p._baseGames ?? p.games)||0);
        let totalGoals=Math.max(0,Number(p._baseGoals ?? p.goals)||0);
        let totalAssists=Math.max(0,Number(p._baseAssists ?? p.assists)||0);
        // 現実的な上限：年齢の割にゲーム開始前の出場数が多すぎないようにする。
        const maxGames=Math.min(totalGames,Math.max(8,Math.round((age-18)*28 + Math.max(0,age-22)*12)));
        totalGames=maxGames;
        totalGoals=Math.min(totalGoals,Math.floor(totalGames*0.65));
        totalAssists=Math.min(totalAssists,Math.floor(totalGames*0.55));

        const available=allTeams.filter(t=>t!==currentTeam);
        const histories=[];
        let remainingGames=totalGames, remainingGoals=totalGoals, remainingAssists=totalAssists;
        for(let i=seasonCount;i>=1;i--){
          const seasonAge=age-i;
          const cap=seasonAge<=17?4:(seasonAge===18?12:(seasonAge===19?22:(seasonAge<=21?30:34)));
          const seasonsLeft=i;
          const minForLater=Math.max(0,seasonsLeft-1);
          let games=Math.min(cap,Math.max(0,remainingGames-minForLater));
          if(i===1) games=Math.min(cap,remainingGames);

          // 各シーズンの所属先をランダムに決定。移籍を経験した選手も作る。
          let team;
          if(i===1){
            team=Math.random()<0.58?currentTeam:(available.length?available[Math.floor(Math.random()*available.length)]:currentTeam);
          }else{
            const pool=allTeams.filter(t=>t!==currentTeam && t!==histories[histories.length-1]?.team);
            team=(pool.length?pool:allTeams)[Math.floor(Math.random()*(pool.length?pool.length:allTeams.length))];
          }

          const goalCap=Math.min(Math.floor(games*0.65),remainingGoals);
          const assistCap=Math.min(Math.floor(games*0.55),remainingAssists);
          const gamesAfter=Math.max(0,remainingGames-games);
          const goals=Math.min(goalCap,Math.max(0,remainingGoals-Math.floor(gamesAfter*0.65)));
          const assists=Math.min(assistCap,Math.max(0,remainingAssists-Math.floor(gamesAfter*0.55)));
          histories.push({season:-i,seasonLabel:'S-'+i,team,games,goals,assists,preGame:true});
          remainingGames-=games; remainingGoals-=goals; remainingAssists-=assists;
        }
        // 残りの通算値は最終プレゲームシーズンへ寄せる。ただし年齢上限は超えない。
        if(histories.length){
          const last=histories[histories.length-1];
          const room=Math.max(0,34-last.games);
          const addG=Math.min(remainingGames,room);
          last.games+=addG; remainingGames-=addG;
          last.goals+=Math.min(remainingGoals,Math.floor(last.games*0.65)-last.goals); remainingGoals=0;
          last.assists+=Math.min(remainingAssists,Math.floor(last.games*0.55)-last.assists); remainingAssists=0;
        }
        p.history=histories.filter(h=>h.games>0).concat(p.history.filter(h=>!h.preGame));
      });
    });
  }

  // 初期チーム生成後に実行。既存セーブにも不足している過去所属歴を補完する。
  seedPreGameCareerHistory();
  if(typeof normalizeLoadedState==='function'){
    const oldNormalize=normalizeLoadedState;
    normalizeLoadedState=function(){ oldNormalize(); seedPreGameCareerHistory(); };
  }

  // 過去シーズンは「ゲーム開始前」と明示し、所属クラブもそのシーズンのチームを表示する。
  if(typeof renderPlayerDetail==='function'){
    const oldRenderPlayerDetail=renderPlayerDetail;
    renderPlayerDetail=function(){
      const wrap=oldRenderPlayerDetail();
      [...wrap.querySelectorAll('.stat-row')].forEach(row=>{
        const txt=row.textContent||'';
        if(/S-\d+/.test(txt) && !txt.includes('ゲーム開始前')){
          const small=row.querySelector('.small');
          if(small) small.insertAdjacentHTML('afterbegin','<span class="pill" style="margin-right:5px;">ゲーム開始前</span>');
        }
      });
      return wrap;
    };
  }
})();
</script>


<script>
/* ===== PRE-GAME SEASON STATS DISPLAY FIX ===== */
(function(){
  function rebuildPreGameHistoryCard(wrap){
    const title=[...wrap.querySelectorAll('.section-title')].find(x=>(x.textContent||'').includes('シーズン別成績'));
    if(!title) return;
    const card=title.closest('.card');
    if(!card) return;
    const detailTeam=ST.playerDetailTeam||ST.myTeam;
    const roster=ST.teams?.[detailTeam]?.roster||[];
    const p=roster[Math.min(ST.selPlayerIdx,Math.max(0,roster.length-1))];
    if(!p) return;

    const baseGames=Math.max(0,Number(p._baseGames ?? p.games)||0);
    const baseGoals=Math.max(0,Number(p._baseGoals ?? p.goals)||0);
    const baseAssists=Math.max(0,Number(p._baseAssists ?? p.assists)||0);
    let history=Array.isArray(p.history)?p.history:[];

    // 過去シーズンが存在する場合は、それを必ず表示。S-1,S-2...はゲーム開始前。
    const pre=history.filter(h=>h&&h.preGame).sort((a,b)=>Number(b.season)-Number(a.season));
    const post=history.filter(h=>h&&!h.preGame);
    const rows=[...pre,...post].map(h=>({
      season:h.season,
      label:h.seasonLabel || (Number(h.season)<0 ? 'S'+h.season : 'S'+h.season),
      team:h.team||h.club||detailTeam,
      games:Math.max(0,Number(h.games)||0),
      goals:Math.max(0,Number(h.goals)||0),
      assists:Math.max(0,Number(h.assists)||0),
      preGame:!!h.preGame || Number(h.season)<0
    }));

    // 既存セーブ等で履歴自体が消えている場合も、ゲーム開始前の成績を再生成。
    if(!rows.some(r=>r.preGame) && baseGames>0 && Number(p.age)>=19){
      const allTeams=Object.keys(ST.teams||{});
      const available=allTeams.filter(t=>t!==detailTeam);
      const age=Math.max(19,Number(p.age)||19);
      const count=Math.min(6,Math.max(1,age-18));
      let tg=Math.min(baseGames,Math.max(8,Math.round((age-18)*28+Math.max(0,age-22)*12)));
      let tgo=Math.min(baseGoals,Math.floor(tg*.65));
      let ta=Math.min(baseAssists,Math.floor(tg*.55));
      const made=[];
      for(let i=count;i>=1;i--){
        const sa=age-i;
        const cap=sa<=17?4:(sa===18?12:(sa===19?22:(sa<=21?30:34)));
        const games=Math.min(cap,Math.max(0,tg-Math.max(0,i-1)));
        let team;
        const pool=(i===1 && Math.random()<.58)?[detailTeam]:available.filter(t=>t!==made.at(-1)?.team);
        const use=pool.length?pool:allTeams;
        team=use.length?use[Math.floor(Math.random()*use.length)]:detailTeam;
        const goals=Math.min(tgo,Math.floor(games*.65));
        const assists=Math.min(ta,Math.floor(games*.55));
        made.push({season:-i,seasonLabel:'S-'+i,team,games,goals,assists,preGame:true});
        tg-=games;tgo-=goals;ta-=assists;
      }
      p.history=made.filter(x=>x.games>0).concat(history.filter(h=>!h?.preGame));
      rows.length=0;
      p.history.forEach(h=>rows.push({season:h.season,label:h.seasonLabel||('S'+h.season),team:h.team||h.club||detailTeam,games:+h.games||0,goals:+h.goals||0,assists:+h.assists||0,preGame:!!h.preGame||Number(h.season)<0}));
    }

    rows.sort((a,b)=>Number(b.season)-Number(a.season));
    card.innerHTML='<div class="section-title">📊 シーズン別成績</div><div class="small" style="margin-bottom:8px;">ゲーム開始前を含む、シーズンごとの出場数・得点・アシストです。</div>';
    if(!rows.length){
      card.appendChild(el('<div class="small">まだシーズン出場成績がありません。</div>'));
      return;
    }
    rows.forEach(h=>{
      const seasonText=h.preGame ? ('S-'+Math.abs(Number(h.season))) : ('S'+h.season);
      const badge=h.preGame?'<span class="pill" style="margin-right:5px;">ゲーム開始前</span>':'';
      card.appendChild(el(`<div class="stat-row" style="align-items:flex-start;">
        <span>${badge}<b>${seasonText}</b><br><span class="small">${esc(h.team)}</span></span>
        <span class="num">${h.games}試合<br>${h.goals}得点 ・ ${h.assists}アシスト</span>
      </div>`));
    });
  }

  const oldRender=renderPlayerDetail;
  renderPlayerDetail=function(){
    const wrap=oldRender();
    rebuildPreGameHistoryCard(wrap);
    return wrap;
  };
})();
</script>

<script>
/* ================= FINAL MATCH RESULT / GOAL / RATING FIX ================= */
(function(){
  if(typeof playMatch!=='function') return;
  const _playMatchFinalFix=playMatch;

  function getTeamPlayers(team){ return (ST.teams?.[team]?.roster||[]); }
  function getStarters(team){
    const roster=getTeamPlayers(team);
    if(team===ST.myTeam) return Object.values(ST.starters||{}).filter(Boolean).filter(p=>!p.injured);
    return roster.filter(p=>!p.injured).slice(0,11);
  }
  function getParticipants(team,log){
    const map=new Map();
    getStarters(team).forEach(p=>map.set(p.id,p));
    (log||[]).forEach(e=>{
      const text=String(e.text||'');
      const m=text.match(/^🔄\s+(.+?)\s+(.+?)\s+IN\s+／\s+(.+?)\s+OUT$/);
      if(!m || m[1]!==String(team)) return;
      const p=getTeamPlayers(team).find(x=>x.name===m[2]);
      if(p) map.set(p.id,p);
    });
    return [...map.values()];
  }
  function parseNormalGoal(text,home,away){
    const t=String(text||'');
    const m=t.match(/^⚽\s*(\d+)分\s+(.+?)：(.+?)\s+がゴール！$/);
    if(!m) return null;
    const team=m[2], player=m[3];
    if(team!==String(home) && team!==String(away)) return null;
    return {minute:Number(m[1]),team,player};
  }
  function parseOwnGoal(text,home,away){
    const t=String(text||'');
    const m=t.match(/^⚽\s*(\d+)分\s+(.+?)：オウンゴール（(.+?)）$/);
    if(!m) return null;
    const scoringTeam=m[2];
    if(scoringTeam!==String(home) && scoringTeam!==String(away)) return null;
    return {minute:Number(m[1]),team:scoringTeam,player:m[3],ownGoal:true};
  }
  function beforeMap(home,away){
    const b=new Map();
    [home,away].forEach(team=>getTeamPlayers(team).forEach(p=>b.set(team+'|'+p.id,{goals:Number(p.goals)||0,assists:Number(p.assists)||0})));
    return b;
  }
  function statDelta(team,p,before,key){
    const old=Number(before.get(team+'|'+p.id)?.[key])||0;
    return Math.max(0,(Number(p[key])||0)-old);
  }
  function compactScorers(team,players){
    const counts=new Map();
    players.forEach(p=>counts.set(p.id,(counts.get(p.id)||0)+1));
    return [...counts.entries()].map(([id,n])=>{
      const p=players.find(x=>x.id===id);
      return `${team}：${p.name}${n>1?' ×'+n:''}`;
    });
  }

  playMatch=function(home,away){
    const before=beforeMap(home,away);
    const result=_playMatchFinalFix(home,away);
    if(!Array.isArray(result)) return result;

    const hs=Number(result[0])||0, as=Number(result[1])||0;
    let log=Array.isArray(result[4])?result[4]:[];

    const validScorers={};
    [home,away].forEach(team=>{
      validScorers[team]=[];
      const participants=new Map(getParticipants(team,log).map(p=>[p.id,p]));
      getTeamPlayers(team).forEach(p=>{
        const d=statDelta(team,p,before,'goals');
        if(d>0 && participants.has(p.id)) for(let i=0;i<d;i++) validScorers[team].push(p);
      });
    });

    const participantMap={};
    [home,away].forEach(team=>participantMap[team]=new Map(getParticipants(team,log).map(p=>[p.id,p])));

    const goalEvents=log.map((e,idx)=>{
      const g=parseNormalGoal(e.text,home,away);
      return g?{...g,index:idx,event:e}:null;
    }).filter(Boolean);

    const queues={}; queues[home]=[...validScorers[home]]; queues[away]=[...validScorers[away]];
    goalEvents.forEach(g=>{
      const p=(queues[g.team]||[]).shift();
      if(p) g.event.text=`⚽ ${g.minute}分 ${g.team}：${p.name} がゴール！`;
    });

    // スコアと実況のゴール数がずれた旧データにも対応。
    function addMissingGoalEvents(team,score){
      const known=log.filter(e=>parseNormalGoal(e.text,home,away)?.team===team).length;
      const needed=Math.max(0,score-known);
      const q=validScorers[team]||[];
      for(let i=0;i<needed && q[i];i++){
        const minute=Math.min(89,20+i*17);
        log.push({minute,text:`⚽ ${minute}分 ${team}：${q[i].name} がゴール！`});
      }
    }
    addMissingGoalEvents(home,hs);
    addMissingGoalEvents(away,as);

    // 一部のゴールをオウンゴールとして処理。個人得点・アシストには加算しない。
    if((hs+as)>0 && Math.random()<0.025){
      const normalEvents=log.map((e,idx)=>{const g=parseNormalGoal(e.text,home,away);return g?{...g,index:idx,event:e}:null;}).filter(Boolean);
      if(normalEvents.length){
        const chosen=normalEvents[Math.floor(Math.random()*normalEvents.length)];
        const scoringTeam=chosen.team;
        const defendingTeam=scoringTeam===home?away:home;
        const defenders=getParticipants(defendingTeam,log).filter(p=>p.pos==='DF'||p.pos==='GK');
        if(defenders.length){
          const own=defenders[Math.floor(Math.random()*defenders.length)];
          const original=getTeamPlayers(scoringTeam).find(p=>p.name===chosen.player && participantMap[scoringTeam].has(p.id));
          if(original && Number(original.goals)>0) original.goals--;
          const assistPool=getTeamPlayers(scoringTeam).filter(p=>statDelta(scoringTeam,p,before,'assists')>0);
          if(assistPool.length) assistPool[0].assists=Math.max(0,(Number(assistPool[0].assists)||0)-1);
          chosen.event.text=`⚽ ${chosen.minute}分 ${scoringTeam}：オウンゴール（${defendingTeam}・${own.name}）`;
        }
      }
    }

    // 得点者欄を実況から再構築。オウンゴールは「個人得点」から除外する。
    const homeScorers=[],awayScorers=[],ownGoals=[];
    log.forEach(e=>{
      const og=parseOwnGoal(e.text,home,away);
      if(og){ownGoals.push(og);return;}
      const g=parseNormalGoal(e.text,home,away);
      if(!g) return;
      const p=getTeamPlayers(g.team).find(x=>x.name===g.player && participantMap[g.team].has(x.id));
      if(p)(g.team===home?homeScorers:awayScorers).push(p);
    });
    result[2]=compactScorers(home,homeScorers).concat(ownGoals.filter(x=>x.team===home).map(x=>`${home}：オウンゴール（${x.player}）`));
    result[3]=compactScorers(away,awayScorers).concat(ownGoals.filter(x=>x.team===away).map(x=>`${away}：オウンゴール（${x.player}）`));

    // 両チームの実際の出場選手を評価。途中出場も含める。
    const allRatings=[];
    [home,away].forEach(team=>{
      const myScore=team===home?hs:as;
      const oppScore=team===home?as:hs;
      const resultBonus=myScore>oppScore?0.25:myScore<oppScore?-0.20:0;
      getParticipants(team,log).forEach(p=>{
        const abilityAvg=p.pos==='GK'?((p.gk||0)+total(p))/6:total(p)/5;
        let rating=5.65+abilityAvg/100+((CONDITION_MODS[p.condition]||1)-1)*2.2+resultBonus+(Math.random()-0.5)*0.35;
        const goals=statDelta(team,p,before,'goals');
        const assists=statDelta(team,p,before,'assists');
        rating+=goals*1.05+assists*0.55;
        if(p.pos==='GK'&&oppScore===0) rating+=0.35;
        if(log.some(e=>String(e.text||'').includes(`🟨 ${p.name}（${team}）`))) rating-=0.30;
        if(ownGoals.some(x=>x.player===`${team}・${p.name}`||x.player===p.name)) rating-=0.80;
        rating=Math.max(5.0,Math.min(10.0,Math.round(rating*10)/10));
        allRatings.push({id:p.id,team,name:p.name,pos:p.pos,rating,goals,assists,starter:getStarters(team).some(x=>x.id===p.id)});
      });
    });
    result[5]=allRatings;
    result[4]=log.sort((a,b)=>Number(a.minute)-Number(b.minute));
    return result;
  };

  function renderTeamRatingsCard(team,ratings){
    const card=el(`<div class="card match-team-rating-card" style="margin-top:12px;"></div>`);
    card.innerHTML=`<div class="section-title" style="font-size:12px;">📊 ${esc(team)} <span class="small">選手評価</span></div>`;
    if(!ratings.length){card.appendChild(el(`<div class="small">評価対象の出場選手がいません</div>`));return card;}
    [...ratings].sort((a,b)=>b.rating-a.rating).forEach(x=>{
      const ratingClass=x.rating>=7.5?'color:var(--gold);font-weight:800;':x.rating<6.0?'color:var(--red);font-weight:800;':'font-weight:800;';
      const detail=[];if(x.goals)detail.push(`⚽${x.goals}`);if(x.assists)detail.push(`🅰️${x.assists}`);
      const role=x.starter?'先発':'途中出場';
      card.appendChild(el(`<div class="stat-row"><span><b>${esc(x.name)}</b> <span class="small">${esc(x.pos)}・${role}${detail.length?'・'+detail.join(' '):''}</span></span><span style="${ratingClass}">${Number(x.rating).toFixed(1)}</span></div>`));
    });
    return card;
  }

  if(typeof renderMatchResultModal==='function'){
    renderMatchResultModal=function(){
      const r=ST.matchResultModal;
      if(!r) return null;
      const ov=el(`<div class="modal-overlay"></div>`);
      const badge=r.resultType==='win'?`<span style="color:var(--pitch);font-weight:800;">勝利</span>`:r.resultType==='lose'?`<span style="color:var(--red);font-weight:800;">敗北</span>`:`<span style="color:var(--text-dim);font-weight:800;">引き分け</span>`;
      const compLabel=r.competition?` <span class="small">${esc(r.competition)}${r.roundLabel?'・'+esc(r.roundLabel):''}</span>`:'';
      const m=el(`<div class="modal"><div class="modal-title">⚽ 試合終了 ${badge}${compLabel}</div></div>`);
      m.appendChild(el(`<div style="display:flex;align-items:center;justify-content:center;gap:14px;margin:14px 0;"><div style="flex:1;text-align:center;"><div class="pname" style="font-size:14px;">${esc(r.home)}</div>${r.home===ST.myTeam?'<div class="small" style="color:var(--pitch);">（自クラブ）</div>':''}</div><div style="font-size:26px;font-weight:800;white-space:nowrap;">${r.homeScore} - ${r.awayScore}</div><div style="flex:1;text-align:center;"><div class="pname" style="font-size:14px;">${esc(r.away)}</div>${r.away===ST.myTeam?'<div class="small" style="color:var(--pitch);">（自クラブ）</div>':''}</div></div>`));
      if(r.wentToPenalties)m.appendChild(el(`<div style="text-align:center;font-weight:800;margin:-4px 0 10px;">延長・PK戦 ${esc(r.penaltyScore||'勝者決定')}</div>`));

      const sc=el(`<div class="card" style="margin-bottom:12px;"><div class="section-title" style="font-size:12px;">⚽ 得点・得点者</div></div>`);
      const goals=(r.matchLog||[]).filter(e=>parseNormalGoal(e.text,r.home,r.away)||parseOwnGoal(e.text,r.home,r.away));
      if(goals.length)goals.forEach(e=>{
        const og=parseOwnGoal(e.text,r.home,r.away),g=parseNormalGoal(e.text,r.home,r.away);
        if(og)sc.appendChild(el(`<div class="stat-row"><span>${og.minute}'</span><span><b>${esc(og.team)}</b>：<span style="color:var(--red);font-weight:800;">オウンゴール</span>（${esc(og.player)}）</span></div>`));
        else if(g)sc.appendChild(el(`<div class="stat-row"><span>${g.minute}'</span><span><b>${esc(g.team)}</b>：${esc(g.player)} <span class="small">⚽ ゴール</span></span></div>`));
      });
      else sc.appendChild(el(`<div class="small">得点なし</div>`));
      m.appendChild(sc);

      const rawRatings=Array.isArray(r.matchRatings)?r.matchRatings:[];
      const homeRatings=rawRatings.filter(x=>x.team===r.home||(!x.team&&r.home===ST.myTeam));
      const awayRatings=rawRatings.filter(x=>x.team===r.away||(!x.team&&r.away===ST.myTeam));
      const oldOnly=!rawRatings.some(x=>x.team);
      const tab=el(`<div class="match-rating-tabs" style="display:flex;gap:6px;margin-top:12px;"></div>`);
      const btnHome=el(`<button class="btn btn-primary" style="flex:1;font-size:11px;">${esc(r.home)} 評価</button>`);
      const btnAway=el(`<button class="btn btn-ghost" style="flex:1;font-size:11px;">${esc(r.away)} 評価</button>`);
      tab.appendChild(btnHome);tab.appendChild(btnAway);m.appendChild(tab);
      const ratingWrap=el(`<div></div>`);m.appendChild(ratingWrap);
      function showRatings(which){
        ratingWrap.innerHTML='';
        if(oldOnly&&which==='away')ratingWrap.appendChild(el(`<div class="card match-team-rating-card" style="margin-top:12px;"><div class="small">この試合データは旧形式のため、相手チームの評価は保存されていません。</div></div>`));
        else ratingWrap.appendChild(renderTeamRatingsCard(which==='home'?r.home:r.away,which==='home'?homeRatings:awayRatings));
        btnHome.className=which==='home'?'btn btn-primary':'btn btn-ghost';btnAway.className=which==='away'?'btn btn-primary':'btn btn-ghost';
      }
      btnHome.onclick=()=>showRatings('home');btnAway.onclick=()=>showRatings('away');showRatings('home');

      if(r.matchLog&&r.matchLog.length){
        const logCard=el(`<div class="card" style="margin-top:12px;"><div class="section-title" style="font-size:12px;">📻 試合実況・途中経過</div></div>`);
        const logBox=el(`<div style="max-height:240px;overflow-y:auto;padding:6px 4px;border:1px solid var(--border);border-radius:8px;background:rgba(0,0,0,.08);"></div>`);
        r.matchLog.forEach(e=>logBox.appendChild(el(`<div style="padding:5px 2px;border-bottom:1px solid var(--border);font-size:12px;line-height:1.45;"><span style="display:inline-block;width:38px;font-weight:800;">${e.minute}'</span><span>${esc(e.text)}</span></div>`)));
        logCard.appendChild(logBox);m.appendChild(logCard);
      }
      m.appendChild(el(`<div class="stat-row"><span>現在の順位</span><span class="num">${esc(ST.myDivision)} ${rankOf(ST.myTeam)}位</span></div>`));
      const close=el(`<button class="btn btn-primary btn-block" style="margin-top:12px;">閉じる</button>`);
      close.onclick=()=>{ST.matchResultModal=null;render();};m.appendChild(close);ov.appendChild(m);return ov;
    };
  }
})();
</script>

<script>

/* ================= ACHIEVEMENT TABS / HISTORY FIX ================= */
(function(){
  const _base=renderAchievements;
  renderAchievements=function(){
    const wrap=_base();
    // Remove any previous club-history/legend cards accidentally appended to the achievement tabs.
    [...wrap.querySelectorAll('.section-title')].forEach(x=>{
      const t=x.textContent||'';
      if(t.includes('クラブ成績推移')||t.includes('レジェンド')||t.includes('殿堂入り')) x.closest('.card')?.remove();
    });
    // Normalize achievement tabs to exactly three independent sections.
    let tabs=wrap.querySelector('.achievement-tabs');
    if(!tabs){
      tabs=el('<div class="achievement-tabs"></div>');
      const ref=wrap.querySelector('.trophy-hero')?.nextSibling;
      if(ref) wrap.insertBefore(tabs,ref); else wrap.appendChild(tabs);
    }
    tabs.innerHTML='<div class="tab">🏆 歴代タイトル</div><div class="tab">⭐ 個人記録</div><div class="tab">🏛️ 歴代クラブ情報</div>';
    const ts=tabs.querySelectorAll('.tab');
    const mode=ST.achievementTab==='clubHistory'?'clubHistory':(ST.achievementTab==='records'?'records':'titles');
    ST.achievementTab=mode;
    ts.forEach((t,j)=>t.classList.toggle('active',(j===0&&mode==='titles')||(j===1&&mode==='records')||(j===2&&mode==='clubHistory')));
    ts[0].onclick=()=>{ST.achievementTab='titles';render();};
    ts[1].onclick=()=>{ST.achievementTab='records';render();};
    ts[2].onclick=()=>{ST.achievementTab='clubHistory';render();};

    // Locate/remove all dynamically generated personal-record cards, then rebuild a stable one.
    [...wrap.querySelectorAll('.section-title')].forEach(x=>{
      const t=x.textContent||'';
      if(t.includes('自クラブ歴代個人記録')||t.includes('自クラブ歴代個人シーズン記録')||t.includes('ポジション別の歴代記録')) x.closest('.card')?.remove();
    });
    if(mode==='records'){
      const card=el('<div class="card"><div class="section-title">📊 自クラブ歴代個人シーズン記録</div><div class="small" style="margin-bottom:8px;">自クラブ所属時の各シーズン成績を、得点・アシスト・平均評価でランキング表示します。</div></div>');
      const rows=[];
      Object.values(ST.achievements?.records||{}).forEach(r=>{
        (r.history||[]).forEach(h=>{if(h&&(h.team===ST.myTeam||h.club===ST.myTeam))rows.push({name:r.name,pos:r.pos,season:h.season,games:+h.games||0,goals:+h.goals||0,assists:+h.assists||0,rating:+(h.rating??h.avgRating)||0});});
      });
      (ST.teams?.[ST.myTeam]?.roster||[]).forEach(p=>{
        (p.history||[]).forEach(h=>{if(h&&h.team===ST.myTeam)rows.push({name:p.name,pos:p.pos,season:h.season,games:+h.games||0,goals:+h.goals||0,assists:+h.assists||0,rating:+(h.rating??h.avgRating)||0});});
      });
      const dedup=new Map();rows.forEach(r=>dedup.set(r.name+'|'+r.pos+'|'+r.season,r));
      const list=[...dedup.values()];
      const sections=[['⚽ 得点ランキング','goals',r=>r.goals+'得点'],['🅰️ アシストランキング','assists',r=>r.assists+'アシスト'],['⭐ 評価ランキング','rating',r=>Number(r.rating).toFixed(2)]];
      sections.forEach(([label,key,fmt])=>{
        card.appendChild(el('<div class="section-title" style="font-size:12px;margin-top:10px;">'+label+'</div>'));
        const arr=list.filter(r=>key!=='rating'||r.rating>0).sort((a,b)=>(b[key]-a[key])||(b.games-a.games)).slice(0,10);
        if(!arr.length){card.appendChild(el('<div class="empty-state">まだシーズン記録がありません。</div>'));return;}
        arr.forEach((r,n)=>card.appendChild(el('<div class="list-item"><div><div class="pname">'+(n+1)+'. '+esc(r.name)+' <span class="small">'+esc(r.pos||'')+'・S'+esc(String(r.season))+'</span></div><div class="pmeta">'+r.games+'試合 ・ '+r.goals+'得点 ・ '+r.assists+'アシスト'+(r.rating?' ・ 平均評価 '+Number(r.rating).toFixed(2):'')+'</div></div><span class="pill rankS">'+fmt(r)+'</span></div>')));
      });
      wrap.appendChild(card);
    }else if(mode==='clubHistory'){
      if(typeof renderClubHistoryCard==='function')wrap.appendChild(renderClubHistoryCard());
      if(typeof renderHallOfFameCard==='function')wrap.appendChild(renderHallOfFameCard());
    }
    return wrap;
  };
})();

/* ================= CLUB HISTORY / LEGENDS / HALL OF FAME ================= */
(function(){
  function ensureLegacyData(){
    if(!ST) return;
    if(!Array.isArray(ST.clubHistory)) ST.clubHistory=[];
    if(!Array.isArray(ST.hallOfFame)) ST.hallOfFame=[];
  }
  function ownClubSeasonRows(){
    ensureAchievements();
    const rows=[];
    Object.values(ST.achievements.records||{}).forEach(r=>{
      (Array.isArray(r.clubHistory)?r.clubHistory:[]).forEach(h=>{
        if(h.team===ST.myTeam) rows.push({...h,id:r.id,name:r.name,pos:r.pos});
      });
    });
    (ST.teams?.[ST.myTeam]?.roster||[]).forEach(p=>{
      (p.history||[]).filter(h=>h.team===ST.myTeam).forEach(h=>rows.push({...h,id:p.id,name:p.name,pos:p.pos}));
    });
    const m=new Map(); rows.forEach(r=>m.set(`${r.id}|${r.season}|${r.team}`,r));
    return [...m.values()];
  }
  function updateHallOfFame(){
    ensureLegacyData(); ensureAchievements();
    const rows=ownClubSeasonRows(), byId=new Map();
    rows.forEach(r=>{
      const x=byId.get(r.id)||{id:r.id,name:r.name,pos:r.pos,seasons:0,games:0,goals:0,assists:0};
      x.name=r.name||x.name; x.pos=r.pos||x.pos; x.seasons++; x.games+=Number(r.games)||0; x.goals+=Number(r.goals)||0; x.assists+=Number(r.assists)||0;
      byId.set(r.id,x);
    });
    byId.forEach(x=>{
      const awards=(ST.achievements.individual||[]).filter(a=>a.team===ST.myTeam&&a.name===x.name).length;
      const reasons=[];
      if(x.games>=300) reasons.push('クラブ通算300試合');
      if(x.goals>=100) reasons.push('クラブ通算100得点');
      if(x.assists>=100) reasons.push('クラブ通算100アシスト');
      if(awards>=4) reasons.push('個人表彰4回以上');
            if(!reasons.length) return;
      const old=ST.hallOfFame.find(h=>h.id===x.id&&h.club===ST.myTeam);
      if(old){Object.assign(old,{name:x.name,pos:x.pos,games:x.games,goals:x.goals,assists:x.assists,seasons:x.seasons,awards,reasons});}
      else ST.hallOfFame.push({id:x.id,name:x.name,pos:x.pos,club:ST.myTeam,inductedSeason:ST.season,games:x.games,goals:x.goals,assists:x.assists,seasons:x.seasons,awards,reasons});
    });
    const dedup=new Map(); ST.hallOfFame.forEach(h=>dedup.set(`${h.id}|${h.club}`,h)); ST.hallOfFame=[...dedup.values()];
  }
  function renderLineChart(rows,key,label,unit,format){
    if(!rows.length) return el(`<div class="small">まだシーズンをまたいだ記録がありません。シーズン終了後から推移が蓄積されます。</div>`);
    const W=620,H=220,PL=52,PR=14,PT=18,PB=42, vals=rows.map(r=>Number(r[key])||0), min=Math.min(...vals), max=Math.max(...vals), range=(max-min)||1;
    const x=i=>PL+(W-PL-PR)*(rows.length===1?.5:i/(rows.length-1)), y=v=>(H-PB)-((v-min)/range)*(H-PT-PB);
    const points=rows.map((r,i)=>`${x(i).toFixed(1)},${y(Number(r[key])||0).toFixed(1)}`).join(' ');
    const grid=[0,.25,.5,.75,1].map(t=>{const yy=(H-PB)-t*(H-PT-PB),v=min+t*range;return `<line x1="${PL}" y1="${yy}" x2="${W-PR}" y2="${yy}" stroke="var(--line)"/><text x="${PL-6}" y="${yy+4}" text-anchor="end" font-size="10" fill="var(--text-dim)">${format?format(v):Math.round(v)}${unit||''}</text>`;}).join('');
    const dots=rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(Number(r[key])||0)}" r="4" fill="var(--gold)"/><text x="${x(i)}" y="${H-20}" text-anchor="middle" font-size="10" fill="var(--text-dim)">S${r.season}</text>`).join('');
    return el(`<div><div class="small" style="margin:2px 0 5px;">${esc(label)}</div><svg viewBox="0 0 ${W} ${H}" width="100%" height="220" role="img" aria-label="${esc(label)}のシーズン推移">${grid}<polyline points="${points}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg></div>`);
  }
  function renderClubHistoryCard(){
    ensureLegacyData();
    const card=el(`<div class="card"><div class="section-title">📈 クラブ成績推移</div><div class="small" style="margin-bottom:8px;">シーズンをまたいだ順位・予算・ファン数の変化を確認できます。</div></div>`);
    const rows=[...ST.clubHistory].sort((a,b)=>Number(a.season)-Number(b.season));
    if(!rows.length){card.appendChild(el(`<div class="empty-state">シーズン終了後にクラブの歴史がここへ記録されます。</div>`));return card;}
    const tabs=el(`<div class="tabs" style="margin-bottom:8px;"><div class="tab active">順位</div><div class="tab">予算</div><div class="tab">ファン数</div></div>`), body=el(`<div></div>`); card.appendChild(tabs);card.appendChild(body);
    const ts=tabs.querySelectorAll('.tab');
    function show(i){body.innerHTML='';ts.forEach((t,j)=>t.classList.toggle('active',i===j));if(i===0)body.appendChild(renderLineChart(rows,'rank','リーグ順位','位',v=>Math.round(v)));if(i===1)body.appendChild(renderLineChart(rows,'budget','シーズン終了時予算','M',v=>Math.round(v)));if(i===2)body.appendChild(renderLineChart(rows,'fans','シーズン終了時ファン数','人',v=>Math.round(v).toLocaleString()));}
    ts.forEach((t,i)=>t.onclick=()=>show(i));show(0);return card;
  }
  function renderHallOfFameCard(){
    ensureLegacyData();updateHallOfFame();
    const card=el(`<div class="card"><div class="section-title">🏛️ レジェンド / 殿堂入り</div><div class="small" style="margin-bottom:8px;">クラブの歴史に大きな功績を残した選手を永久保存します。引退・移籍後も記録が残ります。</div></div>`);
    const list=[...ST.hallOfFame].filter(h=>h.club===ST.myTeam).sort((a,b)=>(b.games+b.goals*3+b.assists*2)-(a.games+a.goals*3+a.assists*2));
    if(!list.length){card.appendChild(el(`<div class="empty-state">まだ殿堂入り選手はいません。長く活躍した選手を育てましょう。</div>`));return card;}
    list.forEach(h=>card.appendChild(el(`<div class="list-item"><div style="min-width:0;"><div class="pname">🏛️ ${esc(h.name)} <span class="small">${esc(h.pos||'')}</span></div><div class="pmeta">クラブ通算 ${h.games}試合 ・ ${h.goals}得点 ・ ${h.assists}アシスト ・ ${h.seasons}シーズン${h.awards?' ・ 🏅表彰'+h.awards+'回':''}</div><div class="small" style="margin-top:3px;">殿堂入り基準：${esc((h.reasons||[]).join(' / '))}</div></div><span class="pill rankS">LEGEND</span></div>`)));
    return card;
  }
  const oldRecord=recordSeasonAchievements;
  recordSeasonAchievements=function(){
    oldRecord();ensureLegacyData();ensureAchievements();
    Object.keys(ST.teams||{}).forEach(team=>(ST.teams[team].roster||[]).forEach(p=>{
      const r=ST.achievements.records[p.id]||{id:p.id,name:p.name,pos:p.pos,games:0,goals:0,assists:0,awards:0};
      r.clubHistory=Array.isArray(r.clubHistory)?r.clubHistory:[];
      (p.history||[]).filter(h=>h.team===ST.myTeam).forEach(h=>{const k=`${h.season}|${h.team}`;if(!r.clubHistory.some(x=>`${x.season}|${x.team}`===k))r.clubHistory.push({...h});});
      r.clubHistory=r.clubHistory.slice(-30);ST.achievements.records[p.id]=r;
    }));
    updateHallOfFame();
  };
  const oldEnsure=ensureAchievements;
  ensureAchievements=function(){oldEnsure();ensureLegacyData();Object.values(ST.achievements.records||{}).forEach(r=>{if(!Array.isArray(r.clubHistory))r.clubHistory=[];});};
  const oldNormalize=normalizeLoadedState;
  normalizeLoadedState=function(){oldNormalize();ensureLegacyData();updateHallOfFame();};
  const oldResolve=resolveWeek;
  resolveWeek=function(holder){
    ensureLegacyData();
    const ending=isSeasonEndMonth()&&Number(ST.week)===8&&!!ST.myTeam;
    let snap=null;
    if(ending){const div=ST.teams?.[ST.myTeam]?.division||ST.myDivision,list=sortedDivision(div);snap={season:Number(ST.season)||1,div,rank:Math.max(1,list.indexOf(ST.myTeam)+1),points:Number(ST.teamStats?.[ST.myTeam]?.pts)||0};}
    const out=oldResolve(holder);
    if(snap){ST.clubHistory=ST.clubHistory.filter(x=>Number(x.season)!==snap.season||x.team!==ST.myTeam);ST.clubHistory.push({...snap,team:ST.myTeam,budget:Number(ST.budget)||0,fans:Number(ST.fans)||0,recordedAt:Date.now()});ST.clubHistory.sort((a,b)=>a.season-b.season);ST.clubHistory=ST.clubHistory.slice(-20);updateHallOfFame();}
    return out;
  };
  const oldRenderAchievements=renderAchievements;
  renderAchievements=function(){
    const wrap=oldRenderAchievements();
    ensureLegacyData();
    updateHallOfFame();
    const mode=ST.achievementTab==='clubHistory'?'clubHistory':(ST.achievementTab==='records'?'records':'titles');
    // クラブ成績推移・殿堂入りは「歴代クラブ情報」だけに表示
    [...wrap.querySelectorAll('.section-title')].forEach(x=>{
      const t=x.textContent||'';
      if(mode!=='clubHistory' && (t.includes('クラブ成績推移')||t.includes('レジェンド')||t.includes('殿堂入り'))){
        x.closest('.card')?.remove();
      }
    });
    if(mode==='clubHistory'){
      wrap.appendChild(renderClubHistoryCard());
      wrap.appendChild(renderHallOfFameCard());
    }
    return wrap;
  };
})();
</script>
